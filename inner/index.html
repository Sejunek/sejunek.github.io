<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WORLD — 내면 탐색</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#FFFFFF; --bg-subtle:#F4F4F2; --bg-inverse:#111111;
    --text-primary:#111111; --text-secondary:#8A8A8A; --text-inverse:#FFFFFF;
    --border-line:#E4E4E1; --point:#2D45FF; --point-hover:#1B31D6;
    --font-latin:"Archivo","Helvetica Neue",Arial,sans-serif;
    --font-kr:"IBM Plex Sans KR","Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;
    --ease:cubic-bezier(.215,.61,.355,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
    background:var(--bg-base);color:var(--text-primary);font-family:var(--font-kr);
    -webkit-font-smoothing:antialiased}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .t-mono{font-family:var(--font-latin);font-weight:500;font-size:12px;line-height:16px;letter-spacing:1.2px}
  .t-h-l{font-family:var(--font-latin);font-weight:600;font-size:32px;line-height:40px;letter-spacing:-.8px}
  .t-body{font-size:16px;line-height:28px}
  .t-body-s{font-size:13px;line-height:22px}
  .muted{color:var(--text-secondary)}

  /* 상단 — 진행 막대 + 경로 */
  #steps{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:21;
    display:flex;gap:7px;align-items:center;pointer-events:none;opacity:0;transition:opacity .45s var(--ease)}
  #steps.on{opacity:1}
  #steps .seg{width:38px;height:2px;background:var(--border-line);
    transition:background .4s var(--ease),transform .4s var(--ease)}
  #steps .seg.done{background:var(--text-primary)}
  #steps .seg.now{background:var(--point);transform:scaleY(2)}
  #top{position:fixed;top:0;left:0;right:0;z-index:21;padding:28px 32px;
    display:flex;align-items:baseline;gap:20px;pointer-events:none}
  #back{pointer-events:auto;opacity:0;transform:translateX(-6px);
    transition:opacity .4s var(--ease),transform .4s var(--ease),color .2s}
  #back.on{opacity:1;transform:none}
  #back:hover{color:var(--point)}
  #crumb{color:var(--text-secondary)}
  #crumb b{color:var(--text-primary);font-weight:500}

  /* 하단 — 정보 */
  #panel{position:fixed;left:32px;bottom:32px;width:min(420px,calc(100% - 64px));z-index:22;
    opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .5s var(--ease),transform .5s var(--ease)}
  #panel.on{opacity:1;transform:none;pointer-events:auto}
  #p-kick{color:var(--point);margin-bottom:14px}
  #p-title{margin:0 0 4px;font-family:var(--font-kr);font-weight:500;font-size:28px;line-height:38px;letter-spacing:-.6px}
  #p-sub{margin:0 0 16px;color:var(--text-secondary)}
  #p-desc{margin:0 0 24px;max-width:38ch}
  #go{display:inline-flex;align-items:center;gap:12px;padding:15px 26px;
    background:var(--bg-inverse);color:var(--text-inverse);transition:background .25s var(--ease)}
  #go:hover{background:var(--point)}
  #go span{font-family:var(--font-latin);font-weight:500;font-size:13px;letter-spacing:1.2px}
  #p-act{display:flex;align-items:center;gap:22px}
  #p-yt{color:var(--text-secondary);text-decoration:none;border-bottom:1px solid var(--border-line);padding-bottom:2px}
  #p-yt:hover{color:var(--point);border-color:var(--point)}

  #hint{position:fixed;left:32px;bottom:32px;z-index:19;color:var(--text-secondary);
    transition:opacity .4s var(--ease)}
  #hint.off{opacity:0}

  /* 재생 */
  #player{position:fixed;inset:0;z-index:40;background:var(--bg-inverse);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px;
    opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s}
  #player.on{opacity:1;visibility:visible}
  #stage{width:min(1100px,100%);max-height:62vh;display:flex;align-items:center;justify-content:center}
  #stage iframe{width:min(1100px,100%);aspect-ratio:16/9;border:0;display:block;background:#000}
  #stage img{max-width:100%;max-height:62vh;display:block}
  #stage audio{width:min(680px,100%)}
  #stage .prose{max-width:62ch;max-height:56vh;overflow-y:auto;color:#EDEDED;font-size:17px;line-height:32px;white-space:pre-wrap}
  #note-wrap{width:min(680px,100%)}
  #note-view{color:rgba(255,255,255,.72);white-space:pre-wrap;font-size:15px;line-height:27px}
  #note-edit{width:100%;min-height:96px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);
    color:#fff;padding:14px;font-family:var(--font-kr);font-size:15px;line-height:27px;border-radius:0}
  #note-edit:focus{outline:0;border-color:#fff}
  #note-btn,#note-save{color:rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:3px}
  #note-btn:hover,#note-save:hover{color:#fff;border-color:#fff}
  #usheet{position:fixed;inset:0;z-index:52;display:flex;justify-content:flex-end;background:rgba(17,17,17,.28);
    opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s}
  #usheet.on{opacity:1;visibility:visible}
  #usheet .box{width:min(460px,100%);height:100%;background:var(--bg-base);padding:36px 36px 40px;overflow-y:auto;
    transform:translateX(24px);transition:transform .45s var(--ease)}
  #usheet.on .box{transform:none}
  #uerr{color:#C0392B;margin-top:14px;min-height:20px}
  #crumb b{color:var(--text-primary);font-weight:500}
  #crumb .lv{color:var(--text-secondary)}
  #ptitle{color:var(--text-inverse);text-align:center}
  #ptitle b{display:block;font-weight:500;font-size:20px;line-height:30px}
  #ptitle span{color:rgba(255,255,255,.5)}
  #pbar{display:flex;align-items:center;gap:28px}
  #popen{color:rgba(255,255,255,.55);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:3px}
  #popen:hover{color:#fff;border-color:#fff}
  #pclose{color:rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:3px}
  #pclose:hover{color:#fff;border-color:#fff}

  /* 추가 UI */
  #tools{position:fixed;top:0;right:0;z-index:23;padding:26px 32px;display:flex;gap:22px;align-items:center}
  #tools button{color:var(--text-secondary)}
  #tools button:hover{color:var(--point)}
  #tools .add{color:var(--text-primary);display:flex;align-items:center;gap:8px}

  #sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;
    background:rgba(17,17,17,.28);opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s}
  #sheet.on{opacity:1;visibility:visible}
  #sheet .box{width:min(460px,100%);height:100%;background:var(--bg-base);padding:36px 36px 40px;
    overflow-y:auto;transform:translateX(24px);transition:transform .45s var(--ease)}
  #sheet.on .box{transform:none}
  #sheet h3{margin:0 0 30px;font-family:var(--font-latin);font-weight:600;font-size:22px;letter-spacing:-.4px}
  .fld{margin-bottom:22px}
  .fld > label{display:block;color:var(--text-secondary);margin-bottom:8px}
  .fld input,.fld select,.fld textarea{width:100%;padding:13px 14px;border:1px solid var(--border-line);
    background:var(--bg-base);font-family:var(--font-kr);font-size:15px;color:var(--text-primary);border-radius:0}
  .fld textarea{resize:vertical;min-height:76px;line-height:26px}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--point)}
  .fld .help{color:var(--text-secondary);margin-top:7px}
  .row{display:flex;gap:12px}
  .row > *{flex:1}
  .sheet-act{display:flex;gap:16px;align-items:center;margin-top:34px}
  .sheet-act button.primary{background:var(--bg-inverse);color:var(--text-inverse);padding:15px 28px;
    transition:background .25s var(--ease)}
  .sheet-act button.primary:hover{background:var(--point)}
  .sheet-act button.ghost{color:var(--text-secondary)}
  .sheet-act button.ghost:hover{color:var(--text-primary)}
  #err{color:#C0392B;margin-top:14px;min-height:20px}
  .mine{margin-top:34px;border-top:1px solid var(--border-line);padding-top:20px}
  .mine ul{margin:12px 0 0;padding:0;list-style:none}
  .mine li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-line)}
  .mine li span{color:var(--text-secondary)}
  .mine li button{color:var(--text-secondary)}
  .mine li button:hover{color:#C0392B}

  @media (max-width:767px){
    #top{padding:20px}
    #panel,#hint{left:20px;bottom:24px;width:calc(100% - 40px)}
    #p-title{font-size:23px;line-height:32px}
    #steps .seg{width:22px} #steps{top:58px}
    #crumb{max-width:58vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #tools{padding:18px 20px;gap:16px}
    #sheet .box{padding:26px 20px 36px}
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="steps"></div>
<div id="top">
  <button id="back" class="t-mono">← BACK</button>
  <div id="crumb" class="t-mono">WORLD</div>
</div>

<div id="hint" class="t-mono">감정을 하나 고르세요</div>

<div id="panel">
  <div id="p-kick" class="t-mono"></div>
  <h2 id="p-title"></h2>
  <p id="p-sub" class="t-body-s"></p>
  <p id="p-desc" class="t-body"></p>
  <div id="p-act">
    <button id="go"><span id="go-label">ENTER</span><span aria-hidden="true">→</span></button>
    <a id="p-yt" class="t-mono" target="_blank" rel="noopener" hidden>YOUTUBE ↗</a>
  </div>
</div>

<div id="tools">
  <button id="export" class="t-mono">EXPORT</button>
  <button id="open-add" class="add t-mono">+ ADD</button>
</div>

<div id="sheet">
  <div class="box">
    <h3 id="sh-title">추가</h3>
    <div id="fields"></div>
    <div id="err" class="t-body-s"></div>
    <div class="sheet-act">
      <button class="primary" id="save"><span class="t-mono">ADD</span></button>
      <button class="ghost t-mono" id="cancel">CANCEL</button>
    </div>
    <div class="mine">
      <div class="t-mono muted">이 우주에 내가 추가한 것</div>
      <ul id="mine-list"></ul>
    </div>
  </div>
</div>

<div id="usheet">
  <div class="box">
    <h3>새 우주 만들기</h3>
    <div class="fld">
      <label class="t-mono">이름</label>
      <input id="u-name" placeholder="예: 문학">
      <input id="u-latin" placeholder="영문 표기 (예: LITERATURE)" style="margin-top:8px">
    </div>
    <div class="fld">
      <label class="t-mono">한 줄 설명</label>
      <input id="u-desc" placeholder="이 우주가 무엇을 담는지">
    </div>
    <div class="fld">
      <label class="t-mono">위계</label>
      <input id="u-levels" placeholder="감정, 작품, 음악·영상">
      <div class="help t-body-s">쉼표로 구분합니다. 적은 개수만큼 단계가 생깁니다. 두 단계여도 되고 네 단계여도 됩니다.</div>
    </div>
    <div class="fld">
      <label class="t-mono">마지막 단계에 담는 것</label>
      <select id="u-leaf">
        <option value="youtube">유튜브 영상</option>
        <option value="text">글</option>
        <option value="image">이미지</option>
        <option value="audio">음악 파일</option>
      </select>
    </div>
    <div id="uerr" class="t-body-s"></div>
    <div class="sheet-act">
      <button class="primary" id="usave"><span class="t-mono">CREATE</span></button>
      <button class="ghost t-mono" id="ucancel">CANCEL</button>
    </div>
    <div class="mine">
      <div class="t-mono muted">내가 만든 우주</div>
      <ul id="uni-list"></ul>
    </div>
  </div>
</div>

<div id="player">
  <div id="ptitle"><b></b><span class="t-body-s"></span></div>
  <div id="stage"></div>
  <div id="note-wrap">
    <div id="note-view" class="t-body"></div>
    <textarea id="note-edit" placeholder="이 영상에서 무엇을 가져왔는지, 지금 떠오른 생각" hidden></textarea>
  </div>
  <div id="pbar">
    <button id="note-btn" class="t-mono">생각 쓰기</button>
    <button id="note-save" class="t-mono" hidden>저장</button>
    <a id="popen" class="t-mono" target="_blank" rel="noopener" hidden>원본 열기 ↗</a>
    <button id="pclose" class="t-mono">CLOSE</button>
  </div>
</div>

<script>
/* ──────────────────────────────────────────────────────────────
   INNER — 내면 탐색
   Finpong 의 궤도 탐색(선택 → 기울기 → 드릴다운 → 뒤로)을 가져와
   감정 → 작품 → 음악·영상 세 단계로 다시 짰습니다.
   화면은 포트폴리오 토큰(흰 바탕 · #111 · #2D45FF · Archivo)을 그대로 씁니다.
   ────────────────────────────────────────────────────────────── */

const $=id=>document.getElementById(id);

const WORLD = {
  name:'세계', latin:'WORLD', desc:'내가 나의 세계를 짓고 싶게 만든 것들.',
  levels:['감정','작품','음악·영상'], leaf:'youtube',
  children:[
    { name:'용기', latin:'COURAGE', sub:'희망 · 용맹',
      desc:'절망 속에서 찾아온 구원, 그리고 어둠을 두려워하지 않고 맞서는 마음.',
      children:[
        { name:'반지의 제왕', latin:'THE LORD OF THE RINGS', sub:'J.R.R. Tolkien · Howard Shore',
          img:'',   // 포스터 이미지 경로 (예: '../assets/img/inner/lotr.jpg')
          desc:'미나스 티리스가 무너지기 직전, 언덕 위에 로한의 기병대가 선다. 두려움과 작은 희망과 용맹이 한 장면에 다 들어 있다.',
          children:[
            { name:'로한의 돌격', latin:'RIDE OF THE ROHIRRIM', sub:'The Return of the King', yt:'7lwJOxN_gXc',
              desc:'미나스 티리스를 구하러 온 기병대가 적진으로 돌진하는 순간, 로한의 주제가 바이올린으로 올라온다. 이 장면의 절정.' }
          ]}
      ]},
    { name:'신비', latin:'WONDER', sub:'상상 · 미지',
      desc:'인간의 상상을 자극하는 것들. 아직 모르는 공간을 머릿속에 세우게 만드는 감각.',
      children:[
        { name:'해리 포터', latin:'HARRY POTTER', sub:'J.K. Rowling · John Williams',
          desc:'첼레스타의 맑은 음에서 시작해 오케스트라와 오르간으로 번진다. 신비는 큰 것이 아니라, 작은 것이 큰 공간에서 울릴 때 온다.',
          children:[
            { name:'헤드위그 테마', latin:"HEDWIG'S THEME", sub:'메인 테마', yt:'Crp_OSv8bc0',
              desc:'오르간과 실로폰, 그리고 오케스트라. 호그와트라는 공간의 웅장함과 신비를 소리만으로 세운다.' }
          ]},
        { name:'야생의 숨결', latin:'BREATH OF THE WILD', sub:'任天堂 · 삼각형의 법칙',
          desc:'게임으로 세계를 동경하게 된 첫 경우. 기억을 잃었다는 설정 하나로 세계를 모르는 사람도 그 안에 들어가게 만들고, 언덕과 산을 삼각형으로 배치해 시선을 가렸다 열어주며 다음 걸음을 플레이어가 직접 고르게 만든다.',
          children:[
            { name:'메인 테마', latin:'MAIN THEME', sub:'관악으로 낸 동양의 신비', yt:'tDkjr_cYO6M',
              desc:'젤다 특유의 웅장함에 피리 같은 관악기로 동양의 신비를 얹었다. 내 세계를 동양의 소리로 짓고 싶다는 생각을 여기서 얻었다.' }
          ]}
      ]},
    { name:'열망', latin:'DESIRE', sub:'각성 · 절정',
      desc:'숨어 있던 열망과 재능을 깨워야 할 것 같은 마음. 나도 한 번은 절정을 태워보고 싶게 만드는 불.',
      children:[
        { name:'Awaken', latin:'AWAKEN', sub:'League of Legends · Ray Chen',
          desc:'게임을 하지 않는데도 이 영상은 매번 나를 일으킨다. 인물들의 내면과 갈등을 번갈아 보여주며 문학의 구성처럼 긴장을 쌓다가, 바이올린이 그 꼭대기를 친다.',
          children:[
            { name:'시네마틱', latin:'CINEMATIC', sub:'Awaken (2019)', yt:'zF5Ddo9JdpY',
              desc:'캐릭터들의 내면과 갈등이 번갈아 나오며 긴장이 점점 고조된다. 마음에 불을 지피는 영상.' },
            { name:'Ray Chen 버전', latin:'RAY CHEN', sub:'바이올린 연주', yt:'EzGVJeIV2cQ',
              desc:'실제로 이 곡에 참여한 바이올리니스트 Ray Chen 의 연주. 절정이 어디인지 연주만으로 드러난다.' }
          ]}
      ]},
    { name:'동경', latin:'LONGING', sub:'세계를 향한 마음',
      desc:'세계 자체를 동경하게 만든 것들. 나도 저런 세계를 짓고 싶다는 생각이 여기서 시작됐다.',
      children:[
        { name:'천공의 섬 라퓨타', latin:'CASTLE IN THE SKY', sub:'宮崎駿 · 久石譲',
          desc:'내가 세계라는 것을 처음으로 동경하게 된 작품. 하늘을 제패했던 기술의 제국이지만, 그 심장을 뚫고 올라온 것은 나무였고 섬은 끝내 자연의 뜻대로 하늘로 사라진다. 인간은 기술을 동경하지만 자연에 대한 동경을 넘지 못한다는 것, 그리고 그 섬을 찾아 모인 사람들 사이의 정이 남는 작품이다.',
          children:[
            { name:'너를 태우고', latin:'KIMI WO NOSETE', sub:'엔딩 테마', yt:'Yy8MEO_2AYo',
              desc:'섬이 하늘로 사라진 뒤에 남는 것. 나도 이런 여운을 남기는 작품을 만들고 싶다.' }
          ]}
      ]}
  ]
};

/* ── 수치 ── */
/* 기준 치수 — 화면 크기에 맞춰 SZ 로 줄여 씁니다 */
const B_HUB=52, B_NODE=40, B_ORBIT=[190,290];
let SZ=1;                                        // resize() 에서 계산합니다
const R_HUB=()=>B_HUB*SZ, R_NODE=()=>B_NODE*SZ, ORBIT=()=>[B_ORBIT[0]*SZ, B_ORBIT[1]*SZ];
const MAXZ=3.2, MINZ=.55;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
/* 각도 차이를 항상 -180°~180° 안으로 접습니다.
   한 번만 빼고 더하던 예전 방식은 차이가 한 바퀴를 넘으면 접히지 않아
   목표까지 여러 바퀴를 도는 문제가 있었습니다. */
const wrap=d=>{ d=(d+Math.PI)%TAU; if(d<0)d+=TAU; return d-Math.PI; };
const lerpA=(a,b,t)=>a+wrap(b-a)*t;
/* 시간 기준 감속 — 프레임 수와 무관하게 같은 속도로 부드럽게 */
const sm=(cur,goal,k,dt)=>lerp(cur,goal,1-Math.exp(-k*dt));
const smA=(cur,goal,k,dt)=>lerpA(cur,goal,1-Math.exp(-k*dt));

const cv=document.getElementById('cv'), c=cv.getContext('2d');
let W=0,H=0,DPR=1,last=0,time=0;

const cam={ zoom:1,tz:1, tilt:0,ttilt:0, rot:0,trot:0, x:0,tx:0, y:0,ty:0,
            vx:0,vy:0, panning:false, manual:false };
const view={ hub:null, nodes:[], ghosts:[], stack:[], focus:null };
let hover=null;

/* 좁은 화면에서는 덜 확대하고 궤도도 덜 벌립니다 */
const FZ=()=>W<620?1.14:1.45;                      // 선택했을 때 배율
const EXP=()=>W<620?0.22:0.55;                     // 기울 때 궤도가 벌어지는 정도
function fitScale(){
  const needW=(B_ORBIT[1]*(1+EXP()) + B_NODE*1.5)*FZ();
  const needH=(B_ORBIT[1]*(1+EXP())*0.52 + B_NODE*1.6)*FZ();
  /* 넉넉한 화면에서는 원래 크기 그대로 둡니다 — 좁을 때만 줄입니다 */
  if(W>=900 && H>=680) return 1;
  return clamp(Math.min((W*0.5)*0.96/needW, (H*0.42)*0.96/needH, 1), .30, 1);
}
function resize(){
  /* 캔버스가 실제로 차지한 크기를 재서 버퍼를 맞춥니다.
     innerHeight 로 잡으면 모바일에서 주소창 때문에 CSS 높이(100vh)와 어긋나
     원이 세로로 늘어나 보입니다. */
  DPR=Math.min(2,devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  W=r.width||innerWidth; H=r.height||innerHeight;
  const bw=Math.max(1,Math.round(W*DPR)), bh=Math.max(1,Math.round(H*DPR));
  cv.width=bw; cv.height=bh;
  c.setTransform(bw/W, 0, 0, bh/H, 0, 0);     // 반올림 오차까지 잡아 정원을 유지합니다
  SZ=fitScale();
}
addEventListener('resize',resize);

/* ── 단계 이동 ── */
function makeNodes(node, backTo){
  const kids=node.children||[];
  return kids.map((k,i)=>{
    const two = kids.length>3;
    const ring = two ? i%2 : 0;
    const inRing = kids.filter((_,j)=> two? j%2===ring : true).length;
    const idx = kids.slice(0,i).filter((_,j)=> two? j%2===ring : true).length;
    const back = backTo && k===backTo;          // 방금 나온 곳 — 중심에서 제자리로 돌아갑니다
    return { data:k, orbit:ORBIT()[ring], speed: ring? .10 : .14,
      angle:(Math.PI*2/inRing)*idx + (ring?.7:0) - Math.PI/2,
      r:R_NODE(), x:0,y:0, scale: back? R_HUB()/R_NODE() : 1,
      alpha:0, born:0, dim:1, lead:!!back };
  });
}
/* from     : 중심으로 날아올 행성 (안으로 들어갈 때)
   backTo   : 중심에서 제자리로 돌아갈 행성의 데이터 (밖으로 나올 때) */
function enter(node,{keepGhost=true, from=null, backTo=null}={}){
  if(keepGhost && view.nodes.length)
    view.ghosts.push(...view.nodes.filter(n=>n!==from).map(n=>({...n, fade:1})));
  view.hub = from
    ? { data:node, x:from.x, y:from.y, r:from.r*from.scale, t:0 }   // 고른 행성이 중심으로 들어옵니다
    : backTo
      ? { data:node, x:0, y:0, r:R_NODE()*.5, t:0 }                   // 상위 항성이 중심에서 자라납니다
      : { data:node, x:0, y:0, r:R_HUB(), t:1 };
  view.nodes=makeNodes(node, backTo);
  view.focus=null; cam.tz=1; cam.ttilt=0; cam.trot=0; cam.tx=0; cam.ty=0;
  cam.vx=cam.vy=0; cam.manual=false;
  chrome();
}
function drill(node){
  if(!node.children||!node.children.length) return;
  const from = view.nodes.find(n=>n.data===node) || null;
  view.stack.push(view.hub.data);
  enter(node,{from});
}
function goUp(){
  if(!view.stack.length){ backToMulti(); return; }
  const leaving = view.hub.data;                 // 지금 중심에 있던 것
  enter(view.stack.pop(), { backTo:leaving });
}

/* ── 화면 밖 UI ── */
const panel=document.getElementById('panel'), goBtn=document.getElementById('go');
const crumb=document.getElementById('crumb'), backBtn=document.getElementById('back');
const hint=document.getElementById('hint'), steps=document.getElementById('steps');
const player=document.getElementById('player'), frame=document.getElementById('frame');

function chrome(){
  const depth=view.stack.length;
  if(uni.mode==='multi'){
    backBtn.classList.remove('on'); steps.classList.remove('on');
    crumb.textContent='MULTIVERSE';
    hint.textContent='좌우로 넘기고, 가운데를 누르면 들어갑니다';
    hint.classList.remove('off'); panel.classList.remove('on');
    return;
  }
  const u=CUR(), lv=levelsOf(u), total=lv.length;
  backBtn.classList.toggle('on', true);
  /* 가운데 눈금 — 칸 하나가 단계 하나, 지금 단계는 파랗게 굵어집니다 */
  if(steps.children.length!==total)
    steps.innerHTML=Array.from({length:total},()=>'<i class="seg"></i>').join('');
  [...steps.children].forEach((el,i)=>{
    el.className='seg'+(i<depth?' done':'')+(i===depth?' now':'');
  });
  steps.classList.add('on');

  /* 우주 이름 → 지금까지 고른 이름 → 지금 단계 이름 */
  const chain=[u.name].concat(view.stack.slice(1).concat([view.hub.data]).map(n=>n.name));
  const here=lv[Math.min(depth,total-1)];
  crumb.innerHTML = chain.map((n,i)=> i===chain.length-1
      ? '<b>'+n+'</b>' : n).join(' &nbsp;/&nbsp; ')
    + ' &nbsp;<span class="lv">· '+here+'</span>';
  hint.textContent = depth<total-1 ? (lv[depth]+' 을(를) 고르세요') : '누르면 열립니다';
  hint.classList.toggle('off', !!view.focus);
  panel.classList.toggle('on', !!view.focus);
  if(view.focus){
    const d=view.focus.data;
    document.getElementById('p-kick').textContent=d.latin||'';
    document.getElementById('p-title').textContent=d.name;
    document.getElementById('p-sub').textContent=d.sub||'';
    document.getElementById('p-desc').textContent=d.desc||'';
    document.getElementById('go-label').textContent = isLeaf(d)?(d.text?'READ':d.img?'VIEW':d.audio?'LISTEN':'PLAY'):'ENTER';
    const yl=document.getElementById('p-yt');
    yl.hidden=!d.yt; if(d.yt) yl.href='https://www.youtube.com/watch?v='+d.yt;
    goBtn.style.display = (isLeaf(d) || (d.children&&d.children.length)) ? '' : 'none';
  }
}
backBtn.onclick=()=>{ if(view.focus) blur(); else goUp(); };
goBtn.onclick=()=>{ const d=view.focus&&view.focus.data; if(!d) return; isLeaf(d)?play(d):drill(d); };

const isLeaf=d=>!!(d.yt||d.text||d.img&&!d.children||d.audio) && !(d.children&&d.children.length);
let curLeaf=null;

function noteKey(d){
  const path=view.stack.concat([view.hub.data]).map(n=>n.name).join('/');
  return (CUR().name)+'::'+path+'/'+d.name;
}
function play(d){
  curLeaf=d;
  const stage=document.getElementById('stage'), open=document.getElementById('popen');
  open.hidden=true;
  if(d.yt){
    stage.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+d.yt+'?autoplay=1&rel=0" '+
      'allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    open.hidden=false; open.href='https://www.youtube.com/watch?v='+d.yt; open.textContent='YOUTUBE 에서 보기 ↗';
  } else if(d.text){
    stage.innerHTML='<div class="prose"></div>';
    stage.querySelector('.prose').textContent=d.text;
  } else if(d.audio){
    stage.innerHTML='<audio controls autoplay src="'+d.audio+'"></audio>';
  } else if(d.img){
    stage.innerHTML='<img alt="">'; stage.querySelector('img').src=d.img;
  } else {
    stage.innerHTML='<div class="prose">내용이 아직 없습니다.</div>';
  }
  document.querySelector('#ptitle b').textContent=d.name;
  document.querySelector('#ptitle span').textContent=d.sub||'';
  showNote(d);
  player.classList.add('on');
}
function showNote(d){
  const t=(STORE.notes||{})[noteKey(d)]||'';
  $('note-view').textContent=t;
  $('note-view').hidden=!t;
  $('note-edit').hidden=true; $('note-edit').value=t;
  $('note-save').hidden=true;
  $('note-btn').textContent=t?'생각 고치기':'생각 쓰기';
  $('note-btn').hidden=false;
}
$('note-btn').onclick=()=>{
  $('note-edit').hidden=false; $('note-view').hidden=true;
  $('note-save').hidden=false; $('note-btn').hidden=true;
  $('note-edit').focus();
};
$('note-save').onclick=()=>{
  if(!curLeaf) return;
  STORE.notes=STORE.notes||{};
  const v=$('note-edit').value.trim();
  if(v) STORE.notes[noteKey(curLeaf)]=v; else delete STORE.notes[noteKey(curLeaf)];
  saveStore(); showNote(curLeaf);
};
function stop(){ player.classList.remove('on'); curLeaf=null;
  setTimeout(()=>{ document.getElementById('stage').innerHTML=''; },400); }
document.getElementById('pclose').onclick=stop;
addEventListener('keydown',e=>{
  if(uni.mode==='multi'){
    if(e.key==='ArrowRight') uniStep(1);
    if(e.key==='ArrowLeft')  uniStep(-1);
    if(e.key==='Enter'){ if(CUR().__add) openUniSheet(); else openUniverse(uni.t); }
    return;
  }
  if(e.key!=='Escape') return;
  if(player.classList.contains('on')) stop(); else if(view.focus) blur(); else goUp(); });

/* ── 선택 ── */
const IMGS=new Map();                                  // 포스터 이미지 캐시
function poster(src){
  if(!src) return null;
  if(!IMGS.has(src)){ const im=new Image(); im.src=src; IMGS.set(src,im); }
  const im=IMGS.get(src);
  return (im.complete && im.naturalWidth) ? im : null;
}
function focusNode(n){
  view.focus=n; n.since=performance.now();             // 포스터는 조금 뒤에 나타납니다
  n.shot=0;
  cam.tz=FZ(); cam.ttilt=1;
  cam.trot=((Math.PI/2-n.angle)%TAU+TAU)%TAU;
  cam.manual=false; cam.vx=cam.vy=0;
  chrome();
}
function blur(){ view.focus=null; cam.tz=1; cam.ttilt=0; cam.trot=0; cam.tx=0; cam.ty=0;
  cam.manual=false; chrome(); }
function step(dir){                                   // 스와이프로 형제 이동
  if(!view.focus) return;
  const list=[...view.nodes].sort((a,b)=>a.angle-b.angle);
  let i=list.indexOf(view.focus);
  i=(i+dir+list.length)%list.length;
  focusNode(list[i]);
}

/* ── 좌표 ── */
const anchorY=()=>H*(view.focus?.42:.5);
function toWorld(px,py){ return { x:(px-W/2)/cam.zoom+cam.x, y:(py-anchorY())/cam.zoom+cam.y }; }
function hit(wx,wy){
  const ys=lerp(1,.52,cam.tilt);
  for(let i=view.nodes.length-1;i>=0;i--){
    const n=view.nodes[i], rx=n.r*n.scale*1.25, ry=n.r*n.scale*ys*1.7;
    if(((wx-n.x)**2)/(rx*rx)+((wy-n.y)**2)/(ry*ry)<=1) return n;
  }
  return null;
}

/* ── 입력: 탭 / 패닝 / 핀치 / 스와이프 ── */
const P={ down:false, moved:false, sx:0, sy:0, lx:0, ly:0, pinch:null, id:null, acted:false };
function down(x,y){
  P.down=true; P.moved=false; P.acted=false; P.sx=P.lx=x; P.sy=P.ly=y;
  cam.vx=cam.vy=0; cam.panning=true;
  if(uni.mode==='multi'){ uni.dragging=true; uni.base=uni.t; uni.v=0; uni.lastT=performance.now(); }
}
function move(x,y){
  if(!P.down) return;
  if(uni.mode==='multi'){
    if(Math.abs(x-P.sx)>5) P.moved=true;
    const span=Math.min(W,H)*0.30;                    // 이만큼 끌면 한 칸
    const prev=uni.t;
    uni.t = uni.base - (x-P.sx)/span;                 // 손가락을 그대로 따라갑니다
    uni.v = (uni.t-prev)/Math.max(.008,(performance.now()-(uni.lastT||performance.now()))/1000);
    uni.lastT=performance.now();
    P.lx=x; P.ly=y; return;
  }
  const dx=x-P.lx, dy=y-P.ly;
  if(Math.abs(x-P.sx)>6||Math.abs(y-P.sy)>6) P.moved=true;
  if(!view.focus){                                    // 선택 없을 때만 화면을 끌 수 있습니다
    cam.x-=dx/cam.zoom; cam.y-=dy/cam.zoom;
    cam.vx=-dx/cam.zoom; cam.vy=-dy/cam.zoom; cam.manual=true;
  }
  P.lx=x; P.ly=y;
}
function up(x,y){
  if(!P.down) return; P.down=false; cam.panning=false;
  if(uni.mode==='multi'){
    uni.dragging=false;
    if(P.moved){
      const fling=uni.v;                              // 초당 몇 칸으로 던졌는지
      uni.target=Math.round(uni.t + clamp(fling*0.22,-2,2));
      uni.v=fling;                                    // 그 속도로 이어서 감깁니다
      return;
    }
    const R0=Math.min(W,H)*0.185;
    if(Math.hypot(x-W/2, y-H*0.42) < R0){
      if(CUR().__add) openUniSheet(); else openUniverse(uni.t);      // 가운데를 누르면 들어갑니다
      return;
    }
    else uniStep(x<W/2 ? -1 : 1);
    return;
  }
  if(view.focus && P.moved){                          // 선택 중 가로 스와이프 = 형제 이동
    const d=x-P.sx;
    if(Math.abs(d)>50) step(d>0?1:-1);
    return;
  }
  if(P.moved) return;
  const w=toWorld(x,y), n=hit(w.x,w.y);
  if(n){ if(view.focus===n){ const d=n.data; isLeaf(d)?play(d):drill(d); } else focusNode(n); }
  else if(view.focus) blur();                         // 배경 탭 → 선택 해제
  else goUp();                                        // 그 다음 배경 탭 → 한 단계 위로
}
cv.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return;
  cv.setPointerCapture(e.pointerId); down(e.clientX,e.clientY); });
cv.addEventListener('pointermove',e=>{
  const w=toWorld(e.clientX,e.clientY); hover=hit(w.x,w.y);
  cv.style.cursor=hover?'pointer':(P.down?'grabbing':'default');
  move(e.clientX,e.clientY);
});
cv.addEventListener('pointerup',e=>up(e.clientX,e.clientY));
cv.addEventListener('pointercancel',()=>{P.down=false;cam.panning=false;
  if(uni.mode==='multi'){ uni.dragging=false; uni.target=Math.round(uni.t); }});

/* 휠 = 줌, 트랙패드 핀치도 여기로 들어옵니다 */
cv.addEventListener('wheel',e=>{ e.preventDefault();
  if(uni.mode==='multi'){ uniStep(Math.sign(e.deltaY||e.deltaX)); return; }
  const k=Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016));
  cam.tz=clamp(cam.tz*k,MINZ,MAXZ);
}, {passive:false});

/* 두 손가락 핀치 */
const touches=new Map();
cv.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches) touches.set(t.identifier,{x:t.clientX,y:t.clientY});
  if(touches.size===2){ P.down=false; cam.panning=false;
    P.pinch={ d:pinchDist(), z:cam.tz }; }
},{passive:true});
cv.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches) if(touches.has(t.identifier)) touches.set(t.identifier,{x:t.clientX,y:t.clientY});
  if(P.pinch && touches.size===2){ e.preventDefault();
    const d=pinchDist();
    cam.tz=clamp(P.pinch.z*(d/P.pinch.d),MINZ,MAXZ);
    if(cam.tz>=MAXZ-.01 && view.focus && view.focus.data.children && !P.acted){
      P.acted=true; drill(view.focus.data);           // 끝까지 벌리면 한 단계 안으로
    } else if(cam.tz<=MINZ+.01 && view.stack.length && !P.acted){
      P.acted=true; goUp();                           // 끝까지 오므리면 한 단계 밖으로
    }
  }
},{passive:false});
function endTouch(e){
  for(const t of e.changedTouches) touches.delete(t.identifier);
  if(touches.size<2){ if(P.pinch && !P.acted && Math.abs(cam.tz-P.pinch.z)/P.pinch.z<.12) cam.tz=P.pinch.z;
    P.pinch=null; P.acted=false; }
}
cv.addEventListener('touchend',endTouch,{passive:true});
cv.addEventListener('touchcancel',endTouch,{passive:true});
function pinchDist(){ const [a,b]=[...touches.values()]; return Math.hypot(a.x-b.x,a.y-b.y); }

/* ── 그리기 ── */
const hexA=(h,a)=>{ const n=parseInt(h.slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'; };
const INK='#111111', LINE='#E4E4E1', SUB='#8A8A8A', POINT='#2D45FF';

function frameLoop(now){
  requestAnimationFrame(frameLoop);
  const dt=Math.min(.05,(now-(last||now))/1000); last=now; time+=dt;

  if(uni.mode==='multi'){
    c.fillStyle='#FFFFFF'; c.fillRect(0,0,W,H);
    drawMulti(dt);
    return;
  }
  if(uni.fade>0){                                     // 들어가는 동안 옆 우주가 흩어집니다
    uni.fade=Math.max(0, uni.fade-dt*2.2);
  }

  /* 카메라 — 시간 기준 감속 */
  cam.zoom=sm(cam.zoom,cam.tz,3.2,dt);
  cam.tilt=sm(cam.tilt,cam.ttilt,3.0,dt);
  cam.rot =smA(cam.rot,cam.trot,3.0,dt);
  cam.rot=((cam.rot%TAU)+TAU)%TAU; cam.trot=((cam.trot%TAU)+TAU)%TAU;
  if(view.focus){ cam.tx=view.focus.x; cam.ty=view.focus.y; }   // 선택한 행성을 따라갑니다
  else if(!view.focus && !cam.panning){ cam.tx=view.hub.x; cam.ty=view.hub.y; }
  if(!cam.panning && !cam.manual){ cam.x=sm(cam.x,cam.tx,3.0,dt); cam.y=sm(cam.y,cam.ty,3.0,dt); }
  if(!cam.panning && cam.manual){                       // 관성
    cam.x+=cam.vx; cam.y+=cam.vy;
    cam.vx*=Math.pow(.02,dt); cam.vy*=Math.pow(.02,dt);
    if(Math.hypot(cam.vx,cam.vy)<.02){ cam.vx=cam.vy=0;
      if(Math.hypot(cam.x-cam.tx,cam.y-cam.ty)>ORBIT()[1]*1.2) cam.manual=false; }
  }
  const ys=lerp(1,.52,cam.tilt);

  c.clearRect(0,0,W,H);
  c.fillStyle='#FFFFFF'; c.fillRect(0,0,W,H);
  if(uni.fade>0) drawMulti(0, uni.fade*uni.fade);    // 방금 떠나온 멀티버스의 잔상

  c.save();
  c.translate(W/2,anchorY()); c.scale(cam.zoom,cam.zoom); c.translate(-cam.x,-cam.y);

  /* 궤도 */
  [...new Set(view.nodes.map(n=>n.orbit))].forEach(r=>{
    const orb=r*(1+EXP()*cam.tilt)*(1-Math.pow(1-view.hub.t,3));
    c.save(); c.translate(view.hub.x,view.hub.y); c.scale(1,ys);
    c.globalAlpha=view.hub.t;
    c.strokeStyle=LINE; c.lineWidth=1/cam.zoom;
    c.beginPath(); c.arc(0,0,orb,0,7); c.stroke(); c.restore();
  });

  /* 중심 — 고른 행성이 안쪽으로 들어오는 동안 */
  const hub=view.hub;
  hub.t=Math.min(1,hub.t+dt*2.1);
  hub.x=sm(hub.x,0,6,dt); hub.y=sm(hub.y,0,6,dt); hub.r=sm(hub.r,R_HUB(),6,dt);

  /* 상태 갱신 — 중심이 자리를 잡은 뒤에 위성이 펼쳐집니다 */
  const gate = 1-Math.pow(1-hub.t,2);
  view.nodes.forEach((n,i)=>{
    n.angle=(n.angle + n.speed*dt*(view.focus?.15:1))%TAU;   // 0~360° 안에 묶어 둡니다
    n.born = Math.min(1, n.born + dt*(n.lead? 2.6 : (1.6 + i*.12)*(view.hub.t>.35?1:0) )*(n.lead?1:gate));
    const ease = 1-Math.pow(1-n.born,3);
    const a=n.angle+cam.rot, orb=n.orbit*(1+.55*cam.tilt);
    n.x=hub.x+Math.cos(a)*orb*ease; n.y=hub.y+Math.sin(a)*orb*ease*ys;
    const near=(Math.sin(a)+1)/2;
    const want = view.focus===n ? 1.38 : (cam.ttilt? lerp(.82,1.06,near) : 1);
    n.scale=sm(n.scale,want,7,dt);
    n.dim=sm(n.dim,(view.focus&&view.focus!==n)?.32:1,7,dt);
    const wantShot = (view.focus===n && n.data.img && (performance.now()-(n.since||0))>420) ? 1 : 0;
    n.shot=sm(n.shot||0,wantShot,4.5,dt);
    n.alpha=ease;
  });

  /* 사라지는 이전 단계 */
  for(let i=view.ghosts.length-1;i>=0;i--){
    const g=view.ghosts[i];
    g.fade-=dt*2.2; g.scale=sm(g.scale,.6,4,dt);
    if(g.fade<=0){ view.ghosts.splice(i,1); continue; }
    c.globalAlpha=g.fade*.5; drawNode(g,true); c.globalAlpha=1;
  }

  const by=n=>Math.sin(n.angle+cam.rot);
  view.nodes.filter(n=>by(n)<0).sort((a,b)=>by(a)-by(b)).forEach(n=>drawNode(n));
  drawHub();
  view.nodes.filter(n=>by(n)>=0).sort((a,b)=>by(a)-by(b)).forEach(n=>drawNode(n));

  c.restore();
}

function drawHub(){
  const h=view.hub, d=h.data, r=h.r, x=h.x, y=h.y;
  c.fillStyle='#FFFFFF'; c.beginPath(); c.arc(x,y,r,0,7); c.fill();
  c.strokeStyle=INK; c.lineWidth=1.4/Math.max(1,cam.zoom*.6); c.stroke();
  c.fillStyle=INK; c.textAlign='center'; c.textBaseline='middle';
  c.font='500 '+(14*r/R_HUB()).toFixed(1)+'px "IBM Plex Sans KR", sans-serif';
  c.fillText(d.name, x, y);
  if(d.latin){
    c.globalAlpha=h.t;
    c.fillStyle=SUB; c.font='500 10px Archivo, sans-serif';
    c.fillText(d.latin, x, y+r+16);
    c.globalAlpha=1;
  }
}

function drawNode(n,ghost){
  const d=n.data, r=n.r*n.scale, on=(view.focus===n);
  c.save();
  if(!ghost) c.globalAlpha=n.alpha*n.dim;

  if(on){                                              // 선택 — 검정으로 채움
    c.fillStyle=INK; c.beginPath(); c.arc(n.x,n.y,r,0,7); c.fill();
    const im=poster(d.img), sh=(n.shot||0);
    if(im && sh>0.01){                                 // 한글 제목 자리에 포스터가 들어옵니다
      c.save(); c.globalAlpha=(n.alpha*n.dim)*sh;
      c.beginPath(); c.arc(n.x,n.y,r,0,7); c.clip();
      const s=Math.max(2*r/im.naturalWidth, 2*r/im.naturalHeight);
      const w=im.naturalWidth*s, h=im.naturalHeight*s;
      c.drawImage(im, n.x-w/2, n.y-h/2, w, h);
      c.restore();
    }
    c.strokeStyle=POINT; c.lineWidth=1.2; c.beginPath(); c.arc(n.x,n.y,r+9,0,7); c.stroke();
  } else {
    c.fillStyle='#FFFFFF'; c.beginPath(); c.arc(n.x,n.y,r,0,7); c.fill();
    c.strokeStyle=(hover===n)?POINT:INK; c.lineWidth=(hover===n)?1.6:1.2; c.stroke();
  }

  c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle=on?'#FFFFFF':INK;
  const label=d.name.length>9?d.name.slice(0,8)+'…':d.name;
  let fs=13*n.scale;                                   // 긴 이름은 글자를 줄여 원 안에 넣습니다
  c.font='500 '+fs.toFixed(1)+'px "IBM Plex Sans KR", sans-serif';
  const maxW=r*1.62;
  if(c.measureText(label).width>maxW){
    fs=Math.max(9*n.scale, fs*maxW/c.measureText(label).width);
    c.font='500 '+fs.toFixed(1)+'px "IBM Plex Sans KR", sans-serif';
  }
  if(!(on && d.img && (n.shot||0)>.5)){                 // 포스터가 덮은 뒤에는 글자를 지웁니다
    c.globalAlpha=(n.alpha*n.dim)*(on&&d.img?1-(n.shot||0):1);
    c.fillText(label,n.x,n.y);
    c.globalAlpha=n.alpha*n.dim;
  }

  if(d.latin){
    c.fillStyle=on?POINT:SUB; c.font='500 10px Archivo, sans-serif';
    const lt=d.latin.length>20?d.latin.slice(0,19)+'…':d.latin;
    c.fillText(lt,n.x,n.y+r+16);
  }
  c.restore();
}

/* ──────────────────────────────────────────────
   저장소 — 이 브라우저에 남습니다.
     universes : 내가 만든 우주(위계와 내용 전부)
     additions : 기본 우주(세계)에 덧붙인 것
     notes     : 마지막 단계마다 적어둔 생각
   ────────────────────────────────────────────── */
const KEY='inner.store.v2';
let STORE={ universes:[], additions:[], notes:{} };
try{
  const raw=JSON.parse(localStorage.getItem(KEY)||'null');
  if(raw) STORE=Object.assign(STORE,raw);
  else {                                            // 예전 저장분을 옮겨옵니다
    const old=JSON.parse(localStorage.getItem('inner.additions.v1')||'[]');
    if(old.length) STORE.additions=old;
  }
}catch(e){}
function saveStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(STORE)); }
  catch(e){ alert('저장 공간이 가득 찼습니다. 이미지나 음악 파일을 줄이거나 지워주세요.'); }
}

const NEW='__new__';
const find=(list,name)=>(list||[]).find(x=>x.name===name);
const ytId=u=>{ u=(u||'').trim();
  const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(u)? u : null); };
const CUR=()=>UNIVERSES[uni.i];
const levelsOf=u=>(u&&u.levels)||['감정','작품','음악·영상'];
const leafOf=u=>(u&&u.leaf)||'youtube';

/* 기본 우주(세계)에 덧붙인 것을 붙입니다 */
function applyAdditions(){
  STORE.additions.forEach(a=>{
    let node=WORLD, path=a.path||[a.emo,a.work];       // 예전 형식도 받아줍니다
    path.forEach((nm,k)=>{
      node.children=node.children||[];
      let next=find(node.children,nm);
      if(!next){ next={ name:nm, latin:(k===0?a.emoLatin:a.workLatin)||'', sub:(k===1?a.workSub:'')||'',
                        img:(k===1?a.workImg:'')||'', desc:'', children:[], __mine:true };
                 node.children.push(next); }
      node=next;
    });
    node.children=node.children||[];
    if(!find(node.children,a.name)) node.children.push(leafNode(a));
  });
}
function leafNode(a){
  return { name:a.name, latin:a.latin||'', sub:a.sub||'', desc:a.desc||'',
           yt:a.yt||'', text:a.text||'', img:a.img||'', audio:a.audio||'', __mine:true };
}

/* 우주 목록을 다시 만듭니다 — 세계 + 내가 만든 것 + 새로 만들기 타일 */
function buildUniverses(){
  WORLD.children.forEach(c=>{ c.__drop=c.__mine; });
  WORLD.children=WORLD.children.filter(c=>!c.__drop);
  (function strip(n){ if(!n.children) return; n.children=n.children.filter(c=>!c.__mine); n.children.forEach(strip); })(WORLD);
  applyAdditions();
  UNIVERSES.length=0;
  UNIVERSES.push(WORLD, ...STORE.universes, { __add:true, name:'새 우주', latin:'NEW', children:[] });
}

/* ── 항목 추가 시트 — 우주의 위계에 맞춰 칸이 만들어집니다 ── */
const sheet=$('sheet'), usheet=$('usheet');
let picks=[];                                        // 단계별로 고른 값

function buildFields(){
  const u=CUR(), lv=levelsOf(u), leaf=leafOf(u);
  $('sh-title').textContent=u.name+' 에 추가';
  let html='';
  lv.forEach((name,k)=>{
    const last=k===lv.length-1;
    html+='<div class="fld"><label class="t-mono">'+(k+1)+' · '+name+'</label>';
    if(!last){
      html+='<select data-lv="'+k+'" class="lvsel"></select>'
         +  '<input data-new="'+k+'" placeholder="새 '+name+' 이름" style="margin-top:10px;display:none">'
         +  '<input data-newlatin="'+k+'" placeholder="영문 표기 (선택)" style="margin-top:8px;display:none">'
         +  '<input data-newsub="'+k+'" placeholder="부제 · 만든 사람 (선택)" style="margin-top:8px;display:none">'
         +  '<input data-newimg="'+k+'" placeholder="대표 이미지 주소 (선택)" style="margin-top:8px;display:none">';
    } else {
      html+='<input id="f-name" placeholder="'+name+' 제목">'
         +  '<div class="row" style="margin-top:8px"><input id="f-latin" placeholder="영문 표기 (선택)">'
         +  '<input id="f-sub" placeholder="부제 (선택)"></div>';
    }
    html+='</div>';
  });
  if(leaf==='youtube')
    html+='<div class="fld"><label class="t-mono">유튜브 링크</label><input id="f-url" placeholder="https://www.youtube.com/watch?v=...">'
        + '<div class="help t-body-s">주소를 그대로 붙여 넣으면 됩니다.</div></div>';
  if(leaf==='text')
    html+='<div class="fld"><label class="t-mono">글</label><textarea id="f-text" style="min-height:160px" placeholder="여기에 씁니다"></textarea></div>';
  if(leaf==='image')
    html+='<div class="fld"><label class="t-mono">이미지</label><input type="file" id="f-file" accept="image/*">'
        + '<div class="help t-body-s">올린 이미지는 가로 1000px 로 줄여 이 브라우저에 저장합니다.</div></div>';
  if(leaf==='audio')
    html+='<div class="fld"><label class="t-mono">음악 파일</label><input type="file" id="f-file" accept="audio/*">'
        + '<div class="help t-body-s">3MB 아래 파일만 저장됩니다. 큰 파일은 링크를 쓰세요.</div>'
        + '<input id="f-url" placeholder="또는 음악 주소 (mp3 링크)" style="margin-top:8px"></div>';
  html+='<div class="fld"><label class="t-mono">한 줄 설명</label><textarea id="f-desc" placeholder="무엇을 가져왔는지"></textarea></div>';
  $('fields').innerHTML=html;
  picks=lv.slice(0,-1).map(()=>null);
  refreshSelects();
}
function nodeAt(depth){                              // 지금 고른 경로의 노드
  let node=CUR();
  for(let k=0;k<depth;k++){
    if(!node) return null;
    node=find(node.children||[], picks[k]);
  }
  return node;
}
function refreshSelects(){
  const lv=levelsOf(CUR());
  lv.slice(0,-1).forEach((name,k)=>{
    const sel=$('fields').querySelector('[data-lv="'+k+'"]'); if(!sel) return;
    const parent=nodeAt(k);
    const list=(parent&&parent.children)||[];
    sel.innerHTML=list.map(x=>'<option>'+x.name+'</option>').join('')+'<option value="'+NEW+'">+ 새로 만들기</option>';
    if(picks[k]&&list.some(x=>x.name===picks[k])) sel.value=picks[k]; else { sel.value=list.length?list[0].name:NEW; }
    picks[k]=sel.value;
    toggleNew(k);
    sel.onchange=()=>{ picks[k]=sel.value; toggleNew(k);
      for(let m=k+1;m<picks.length;m++) picks[m]=null; refreshSelects(); };
  });
}
function toggleNew(k){
  const isNew=picks[k]===NEW;
  ['new','newlatin','newsub','newimg'].forEach(a=>{
    const el=$('fields').querySelector('[data-'+a+'="'+k+'"]'); if(el) el.style.display=isNew?'':'none';
  });
}
function fieldVal(attr,k){ const el=$('fields').querySelector('[data-'+attr+'="'+k+'"]'); return el? el.value.trim():''; }

function renderMine(){
  const mine=(CUR()===WORLD)? STORE.additions
    : (STORE.universes.includes(CUR())? (CUR().__items||[]) : []);
  $('mine-list').innerHTML = mine.length
    ? mine.map((a,i)=>'<li><span class="t-body-s">'+(a.path||[]).join(' / ')+' / <b style="color:var(--text-primary);font-weight:500">'+a.name+'</b></span>'
        +'<button class="t-mono" data-i="'+i+'">DELETE</button></li>').join('')
    : '<li><span class="t-body-s">아직 없습니다</span></li>';
  $('mine-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    mine.splice(+b.dataset.i,1); saveStore(); rebuild();
  });
}

function rebuild(){
  const keep=uni.i;
  buildUniverses();
  uni.i=Math.min(keep, UNIVERSES.length-1);
  if(uni.mode==='system'){ view.stack=[]; enter(UNIVERSES[uni.i],{keepGhost:false}); }
  buildFields(); renderMine(); renderUniList();
}

/* 파일을 작게 줄여 문자열로 저장합니다 */
function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ const k=Math.min(1,1000/Math.max(im.width,im.height));
        const cn=document.createElement('canvas'); cn.width=im.width*k; cn.height=im.height*k;
        cn.getContext('2d').drawImage(im,0,0,cn.width,cn.height);
        res(cn.toDataURL('image/jpeg',.82)); };
      im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function readAudio(file){
  return new Promise((res,rej)=>{
    if(file.size>3*1024*1024) return rej(new Error('big'));
    const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file);
  });
}

$('open-add').onclick=()=>{ if(CUR().__add) return openUniSheet();
  buildFields(); renderMine(); $('err').textContent=''; sheet.classList.add('on'); };
$('cancel').onclick=()=>sheet.classList.remove('on');
sheet.addEventListener('pointerdown',e=>{ if(e.target===sheet) sheet.classList.remove('on'); });

$('save').onclick=async ()=>{
  const u=CUR(), lv=levelsOf(u), leaf=leafOf(u);
  const path=[];
  for(let k=0;k<lv.length-1;k++){
    const nm = picks[k]===NEW ? fieldVal('new',k) : picks[k];
    if(!nm) return fail(lv[k]+' 을(를) 고르거나 새로 적어주세요.');
    path.push(nm);
  }
  const name=($('f-name').value||'').trim();
  if(!name) return fail(lv[lv.length-1]+' 제목을 적어주세요.');

  const item={ path, name, latin:($('f-latin').value||'').trim(), sub:($('f-sub').value||'').trim(),
               desc:($('f-desc').value||'').trim() };
  for(let k=0;k<lv.length-1;k++){
    if(picks[k]===NEW){ item.newAt=item.newAt||{}; item.newAt[k]={ latin:fieldVal('newlatin',k), sub:fieldVal('newsub',k), img:fieldVal('newimg',k) }; }
  }
  try{
    if(leaf==='youtube'){ const id=ytId($('f-url').value); if(!id) return fail('유튜브 주소를 확인해주세요.'); item.yt=id; }
    if(leaf==='text'){ item.text=($('f-text').value||'').trim(); if(!item.text) return fail('글을 적어주세요.'); }
    if(leaf==='image'){ const f=$('f-file').files[0]; if(!f) return fail('이미지를 골라주세요.'); item.img=await readImage(f); }
    if(leaf==='audio'){
      const f=$('f-file').files[0], url=($('f-url').value||'').trim();
      if(f) item.audio=await readAudio(f);
      else if(url) item.audio=url;
      else return fail('음악 파일이나 주소가 필요합니다.');
    }
  }catch(e){ return fail(e.message==='big' ? '3MB 가 넘습니다. 링크를 쓰거나 파일을 줄여주세요.' : '파일을 읽지 못했습니다.'); }

  if(u===WORLD) STORE.additions.push(item);
  else { u.__items=u.__items||[]; u.__items.push(item); attachItem(u,item); }
  saveStore(); rebuild();
  $('err').style.color='var(--point)'; $('err').textContent='추가했습니다.';
  setTimeout(()=>{ $('err').textContent=''; $('err').style.color=''; },1600);
};
function attachItem(u,a){
  let node=u;
  (a.path||[]).forEach((nm,k)=>{
    node.children=node.children||[];
    let next=find(node.children,nm);
    if(!next){ const meta=(a.newAt&&a.newAt[k])||{};
      next={ name:nm, latin:meta.latin||'', sub:meta.sub||'', img:meta.img||'', desc:'', children:[] };
      node.children.push(next); }
    node=next;
  });
  node.children=node.children||[];
  if(!find(node.children,a.name)) node.children.push(leafNode(a));
}
function fail(m){ $('err').style.color=''; $('err').textContent=m; }

/* ── 새 우주 만들기 ── */
function openUniSheet(){ $('uerr').textContent=''; renderUniList(); usheet.classList.add('on'); }
$('ucancel').onclick=()=>usheet.classList.remove('on');
usheet.addEventListener('pointerdown',e=>{ if(e.target===usheet) usheet.classList.remove('on'); });
$('usave').onclick=()=>{
  const name=$('u-name').value.trim();
  const levels=$('u-levels').value.split(',').map(x=>x.trim()).filter(Boolean);
  if(!name) return ($('uerr').textContent='이름을 적어주세요.');
  if(levels.length<2) return ($('uerr').textContent='위계를 두 단계 이상 적어주세요.');
  STORE.universes.push({ name, latin:$('u-latin').value.trim().toUpperCase(),
    desc:$('u-desc').value.trim(), levels, leaf:$('u-leaf').value, children:[], __items:[] });
  saveStore();
  buildUniverses(); renderUniList();
  ['u-name','u-latin','u-desc','u-levels'].forEach(i=>$(i).value='');
  usheet.classList.remove('on');
  uni.i=uni.target=uni.t=UNIVERSES.length-2;         // 방금 만든 우주로 이동
};
function renderUniList(){
  $('uni-list').innerHTML = STORE.universes.length
    ? STORE.universes.map((u,i)=>'<li><span class="t-body-s"><b style="color:var(--text-primary);font-weight:500">'+u.name+'</b> · '
        +u.levels.join(' → ')+'</span><button class="t-mono" data-i="'+i+'">DELETE</button></li>').join('')
    : '<li><span class="t-body-s">아직 없습니다</span></li>';
  $('uni-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(!confirm('이 우주와 그 안의 내용을 지웁니다.')) return;
    STORE.universes.splice(+b.dataset.i,1); saveStore();
    buildUniverses(); uni.i=uni.t=uni.target=0; renderUniList();
  });
}

/* ── 내보내기 ── */
$('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(STORE,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='inner-store.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(usheet.classList.contains('on')) usheet.classList.remove('on');
  else if(sheet.classList.contains('on')) sheet.classList.remove('on');
});

/* ──────────────────────────────────────────────
   멀티버스 — 우주 하나가 곧 하나의 행성계입니다.
   좌우로 넘기고, 가운데 것만 정원, 옆으로 갈수록 기울어 뒤로 물러납니다.
   ────────────────────────────────────────────── */
const UNIVERSES = [];   // buildUniverses() 가 채웁니다
let uni = { i:0, t:0, target:0, base:0, dragging:false, v:0, mode:'multi', fade:0, intro:0 };

function openUniverse(k){
  if(UNIVERSES[wrapN(Math.round(k))].__add) return openUniSheet();
  uni.i=wrapN(Math.round(k)); uni.t=uni.target=Math.round(k); uni.v=0;
  uni.mode='system'; uni.fade=1;                      // 멀티버스가 잠깐 남아 흩어집니다
  view.stack=[];
  enter(UNIVERSES[uni.i],{keepGhost:false});
  view.hub.r=Math.min(W,H)*0.185; view.hub.t=0;       // 고른 원이 그대로 줄어들며 항성이 됩니다
  chrome();
}
function backToMulti(){
  uni.mode='multi'; uni.fade=0; uni.intro=1;          // 1 → 0 으로 펼쳐집니다
  view.focus=null; view.ghosts.length=0;
  cam.tz=1; cam.ttilt=0; cam.trot=0; cam.tx=cam.ty=0; cam.manual=false;
  chrome();
}
const UN=()=>UNIVERSES.length;
const wrapN=v=>{ const n=UN(); return ((v%n)+n)%n; };
const dWrap=d=>{ const n=UN(); d=((d%n)+n)%n; return d>n/2 ? d-n : d; };   // 좌우로 계속 이어집니다
function uniStep(d){ uni.target=Math.round(uni.target)+d; }

/* 한 우주를 원 하나로 그립니다 — 가운데는 정원, 옆은 기울어져 좁아집니다 */
function drawMulti(dt, ghost){
  if(!ghost && !uni.dragging){
    /* 손을 뗀 뒤에는 용수철처럼 목표 칸으로 붙습니다.
       던진 속도를 그대로 이어받아 튕기지 않고 한 번에 감깁니다. */
    const K=48, D=13;                                 // 세기 / 감쇠
    const step=Math.min(dt,1/60);
    for(let k=dt; k>0; k-=step){
      const h=Math.min(step,k);
      uni.v += ((uni.target-uni.t)*K - uni.v*D)*h;
      uni.t += uni.v*h;
    }
    if(Math.abs(uni.target-uni.t)<.0012 && Math.abs(uni.v)<.02){ uni.t=uni.target; uni.v=0; }
  }
  if(!ghost) uni.i=wrapN(Math.round(uni.t));
  if(!ghost && uni.intro>0) uni.intro=Math.max(0, uni.intro-dt*2.6);
  const io=uni.intro, ease=1-Math.pow(io,2);          // 0 → 1 로 펼쳐지는 정도

  const R0=Math.min(W,H)*0.185;
  const CY=H*0.42;                                    // 모든 원의 중심이 놓인 가로선
  const maxAd=Math.max(1, Math.floor(UN()/2));        // 양옆으로 이만큼까지 보입니다
  const edge=W/2 - R0*0.28;                           // 마지막 것이 화면 끝에 닿게
  const stepOut=Math.min(R0*0.46, Math.max(R0*0.26, (edge - R0*0.95)/Math.max(1,maxAd-1)));
  const order=UNIVERSES.map((u,i)=>({u,i,d:dWrap(i-uni.t)}))
    .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));        // 먼 것부터

  order.forEach(({u,d})=>{
    const ad=Math.abs(d);
    if(ghost && ad<.02) return;              // 고른 원은 항성이 되었으니 건너뜁니다
    // 첫 이웃은 가운데에 크게 겹치고, 그 뒤부터는 화면 끝까지 고르게 벌어집니다
    const off1=R0*0.95*Math.min(ad,1) + stepOut*Math.max(0,ad-1);
    const x=W/2 + Math.sign(d)*off1*ease;             // 나올 때는 가운데에서 퍼져 나옵니다
    const sc=1/(1+.26*ad);                            // 뒤로 갈수록 조금씩 작아집니다
    /* 기울기는 거리에 따라 이어집니다. 다 붙으면 ad 가 정확히 0 이 되어 정원이 됩니다. */
    const sx=Math.cos(Math.min(1.40, ad*1.15));
    const al=Math.max(.18, 1-.13*ad)*(ghost||1)*(ad<.02? 1 : ease);
    const r=R0*sc*(ad<.02 ? (R_HUB()/R0 + (1-R_HUB()/R0)*ease) : 1);  // 가운데는 항성 크기에서 자랍니다

    /* 원 하나를 그립니다 — 본체와 반사에서 같이 씁니다 */
    const face=(ctx)=>{
      ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
      if(u.__add){                                   // 새 우주 만들기 타일
        ctx.save(); ctx.setLineDash([6,7]); ctx.strokeStyle=SUB; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle=INK; ctx.lineWidth=1.6;
        const k=r*0.22;
        ctx.beginPath(); ctx.moveTo(-k,0); ctx.lineTo(k,0); ctx.moveTo(0,-k); ctx.lineTo(0,k); ctx.stroke();
        ctx.restore(); return;
      }
      const im=poster(u.img);
      if(im){
        ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.clip();
        const k=Math.max(2*r/im.naturalWidth, 2*r/im.naturalHeight);
        ctx.drawImage(im,-im.naturalWidth*k/2,-im.naturalHeight*k/2,im.naturalWidth*k,im.naturalHeight*k);
        ctx.restore();
      } else {
        ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font='500 '+(20*sc).toFixed(1)+'px "IBM Plex Sans KR", sans-serif';
        ctx.fillText(u.name,0,0);
      }
      ctx.strokeStyle=ad<.5?INK:LINE; ctx.lineWidth=ad<.5?1.6:1.2;
      ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke();
    };

    // 본체 — 중심선 위에 나란히 놓입니다
    c.save(); c.globalAlpha=al; c.translate(x, CY); c.scale(sx,1); face(c); c.restore();

    // 바닥 반사 — 위아래를 뒤집고 아래로 갈수록 흐려집니다
    const pad=4, size=Math.ceil((r+pad)*2);
    if(size>2){
      const off=refCanvas(size);
      const oc=off.getContext('2d');
      oc.setTransform(1,0,0,1,0,0); oc.clearRect(0,0,size,size);
      oc.save(); oc.translate(size/2,size/2); face(oc); oc.restore();
      oc.globalCompositeOperation='destination-out';   // 아래로 갈수록 지웁니다
      const g=oc.createLinearGradient(0,0,0,size);     // 뒤집히므로 위쪽이 더 많이 지워집니다
      g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(.35,'rgba(0,0,0,.88)'); g.addColorStop(1,'rgba(0,0,0,0)');
      oc.fillStyle=g; oc.fillRect(0,0,size,size);
      oc.globalCompositeOperation='source-over';
      c.save();
      c.globalAlpha=al*0.17;
      c.translate(x, CY+2*r+3); c.scale(sx,-1);        // 제 아래에 뒤집어 붙입니다
      c.drawImage(off, -size/2, -size/2);
      c.restore();
    }

    if(!ghost && ad<.5){                              // 가운데 것에만 이름과 안내
      const ty=CY+r*2.05;
      c.save(); c.globalAlpha=1-ad*2; c.textAlign='center';
      c.fillStyle=SUB; c.font='500 11px Archivo, sans-serif';
      c.fillText(u.latin, x, ty+40);
      c.fillStyle=INK; c.font='500 26px "IBM Plex Sans KR", sans-serif';
      c.fillText(u.name, x, ty+76);
      c.fillStyle=SUB; c.font='400 13px "IBM Plex Sans KR", sans-serif';
      if(u.__add) c.fillText('누르면 새 우주를 만듭니다', x, ty+106);
      else {
        const n=(u.children||[]).length, lv=levelsOf(u);
        c.fillText(n? n+'개의 '+lv[0] : '아직 비어 있습니다', x, ty+106);
        c.fillStyle='rgba(138,138,138,.75)'; c.font='500 10.5px Archivo, sans-serif';
        c.fillText(lv.join('  →  '), x, ty+130);
      }
      c.restore();
    }
  });
}

/* 반사용 임시 캔버스 — 크기가 바뀔 때만 다시 만듭니다 */
let _ref=null;
function refCanvas(size){
  if(!_ref || _ref.width!==size){ _ref=document.createElement('canvas'); _ref.width=_ref.height=size; }
  return _ref;
}

buildUniverses();
resize(); enter(UNIVERSES[0],{keepGhost:false}); renderMine(); renderUniList(); requestAnimationFrame(frameLoop);
</script>
</body>
</html>
