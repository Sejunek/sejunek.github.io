<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 테스트</title>
<style>
  body { margin:0; font:16px/1.6 -apple-system, sans-serif; }
  .row { padding:28px 20px; border-bottom:1px solid #ddd; }
  .row:nth-child(even) { background:#f4f4f2; }
  #hud {
    position:fixed; left:0; right:0; bottom:0;
    background:#111; color:#fff; padding:10px 16px;
    font:13px/1.4 ui-monospace, monospace;
  }
</style>
</head>
<body>
<!-- 사이트 CSS도, JS도 쓰지 않는 맨 페이지입니다.
     여기서도 스크롤이 튀면 원인은 사이트 코드가 아니라 브라우저/기기 쪽입니다. -->
<div id="hud">scrollY: <b id="y">0</b> · 최고점: <b id="mn">0</b></div>
<script>
  var n = 60, html = '';
  for (var i = 1; i <= n; i++) html += '<div class="row">' + i + ' — 아래로 내렸다가 다시 위로 올려보세요.</div>';
  document.write(html);
  var y = document.getElementById('y'), mn = document.getElementById('mn'), lo = 1e9;
  addEventListener('scroll', function () {
    var v = Math.round(scrollY);
    if (v < lo) { lo = v; mn.textContent = v; }
    y.textContent = v;
  }, { passive: true });
</script>
</body>
</html>
