<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Portfolio</title>
<meta name="description" content="프로젝트 상세.">
<meta property="og:type" content="article">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<!-- ============================================================
     공용 상세 뷰어 — view.html?p=<slug>
     프로젝트마다 페이지를 따로 만들지 않습니다.
     projects.js 에 한 줄 추가하면 이 페이지가 알아서 렌더합니다.
     이미지는 파일 이름만 맞으면 자동으로 붙고, 없으면 조용히 빠집니다.
     ============================================================ -->

<header class="detail-header">
  <a class="t-mono" href="../index.html">&larr; &nbsp;INDEX</a>
  <span class="t-mono detail-header__title" data-title>PROJECT</span>
  <a class="t-mono" data-nextlink href="../index.html">NEXT &nbsp;&rarr;</a>
</header>

<main>
  <section class="detail-intro">
    <div>
      <span class="t-mono detail-intro__cat" data-cat></span>
      <h1 class="t-display detail-intro__title" data-heading>—</h1>
      <p class="t-body muted detail-intro__sum" data-summary></p>
    </div>
    <dl class="meta">
      <div class="meta__row"><dt class="t-mono meta__key">ROLE</dt><dd class="t-body-s" data-role></dd></div>
      <div class="meta__row"><dt class="t-mono meta__key">PERIOD</dt><dd class="t-body-s" data-period></dd></div>
      <div class="meta__row"><dt class="t-mono meta__key">TOOL</dt><dd class="t-body-s" data-tool></dd></div>
      <div class="meta__row"><dt class="t-mono meta__key">TYPE</dt><dd class="t-body-s" data-type></dd></div>
    </dl>
  </section>

  <div class="stack" data-stack></div>

  <p class="t-mono muted" data-empty hidden
     style="padding:0 var(--pad, 40px) 80px; text-align:center">
    이미지 준비 중입니다.
  </p>

  <a class="next" data-next href="../index.html">
    <span>
      <span class="t-mono next__label">NEXT PROJECT</span>
      <span class="t-display next__title" data-next-title></span>
    </span>
    <span class="t-display next__arrow">&rarr;</span>
  </a>
</main>

<footer class="detail-footer">
  <p class="t-label"><a href="mailto:sejunek@naver.com">sejunek@naver.com</a></p>
  <p class="t-mono muted">© 2026. ALL RIGHTS RESERVED.</p>
</footer>

<script src="../assets/js/nav.js" data-base="../" defer></script>
<script src="projects.js"></script>
<script>
(function () {
  var slug = new URLSearchParams(location.search).get('p');
  var p = slug ? PJ.find(slug) : null;

  if (!p) {
    document.querySelector('[data-heading]').textContent = 'Project not found';
    document.querySelector('[data-summary]').innerHTML =
      '요청하신 프로젝트를 찾을 수 없습니다. <a href="../index.html" style="border-bottom:2px solid var(--point)">목록으로 돌아가기</a>';
    return;
  }

  document.title = p.title + ' — Portfolio';
  document.querySelector('[data-title]').textContent = p.title.toUpperCase();
  document.querySelector('[data-heading]').textContent = p.title;
  document.querySelector('[data-summary]').textContent = p.summary || '';
  document.querySelector('[data-cat]').textContent = p.cat + '  ·  ' + p.year;
  document.querySelector('[data-role]').textContent = p.role || '';
  document.querySelector('[data-period]').textContent = p.period || '';
  document.querySelector('[data-tool]').textContent = p.tool || '';
  document.querySelector('[data-type]').textContent = p.cat || '';

  var nx = PJ.next(p.slug);
  if (nx) {
    document.querySelector('[data-next]').href = 'view.html?p=' + nx.slug;
    document.querySelector('[data-nextlink]').href = 'view.html?p=' + nx.slug;
    document.querySelector('[data-next-title]').textContent = nx.title;
  }

  // ---- 이미지 스택 -------------------------------------------------
  // 파일이 실제로 있는지 먼저 확인하고, 있는 장만 순서대로 붙입니다.
  var stack = document.querySelector('[data-stack]');
  var shots = PJ.shots(p, '../');

  function probe(src) {
    return new Promise(function (res) {
      // 빈 경로면 즉시 '없음'으로 끝냅니다.
      // src 를 빈 문자열로 두면 onerror 가 안 올라와 화면이 통째로 멈춥니다.
      if (!src) { res({ ok: false }); return; }
      var im = new Image();
      im.onload  = function () { res({ ok: true, w: im.naturalWidth, h: im.naturalHeight }); };
      im.onerror = function () { res({ ok: false }); };
      im.src = src;
    });
  }

  // ---- 영상이 있으면 이미지보다 먼저 -------------------------------
  // 파일이 실제로 있을 때만 붙입니다. 없으면 아무 일도 일어나지 않습니다.
  var vinfo = PJ.video(p, '../');
  if (vinfo) {
    fetch(vinfo.src, { method: 'HEAD' }).then(function (r) {
      if (!r.ok) return;
      var v = document.createElement('video');
      v.src = vinfo.src;
      v.controls = true;
      v.preload = 'metadata';
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      probe(vinfo.poster).then(function (ok) { if (ok.ok) v.poster = vinfo.poster; });
      // 기본은 소리 꺼짐 — 컨트롤에서 켤 수 있습니다
      v.muted = true; v.setAttribute('muted', '');
      stack.insertBefore(v, stack.firstChild);
      // autoplayOnView: 화면에 절반 이상 보이면 재생, 벗어나면 멈춤
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (es) {
          es.forEach(function (e) {
            if (e.isIntersecting) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
            else v.pause();
          });
        }, { threshold: 0.5 }).observe(v);
      }
    }).catch(function () { /* 없으면 넘어갑니다 */ });
  }

  // .mp4 / .webm 은 이미지가 아니라 영상입니다. GIF 대신 쓰면 용량이 훨씬 작습니다.
  function isClip(u) { return /\.(mp4|webm)$/i.test(u); }
  function probeAny(src) {
    if (!src) return Promise.resolve({ ok: false });
    if (!isClip(src)) return probe(src);
    return fetch(src, { method: 'HEAD' })
      .then(function (res) { return { ok: res.ok, clip: true }; })
      .catch(function () { return { ok: false }; });
  }

  Promise.all(shots.map(function (s) {
    return Promise.all([probeAny(s.pc), probe(s.mo)]).then(function (r) {
      return { shot: s, pc: r[0], mo: r[1] };
    });
  })).then(function (results) {
    var shown = 0;
    results.forEach(function (r) {
      if (!r.pc.ok) return;

      // 영상은 소리 없이 자동 반복 — GIF 처럼 보이되 용량은 훨씬 작습니다
      if (r.pc.clip) {
        var clip = document.createElement('video');
        clip.src = r.shot.pc;
        clip.autoplay = true; clip.loop = true; clip.muted = true;
        clip.setAttribute('muted', '');
        clip.playsInline = true; clip.setAttribute('playsinline', '');
        clip.controls = false;
        clip.preload = 'metadata';
        stack.appendChild(clip);
        shown++;
        return;
      }

      var pic = document.createElement('picture');
      if (r.mo.ok) {
        var src = document.createElement('source');
        src.media = '(max-width: 767px)';
        src.srcset = r.shot.mo;
        pic.appendChild(src);
      }
      var img = document.createElement('img');
      img.src = r.shot.pc;
      img.alt = p.title + ' — ' + r.shot.name;
      img.width = r.pc.w; img.height = r.pc.h;   // CLS 방지
      img.loading = shown === 0 ? 'eager' : 'lazy';
      img.decoding = 'async';
      pic.appendChild(img);
      stack.appendChild(pic);
      shown++;
    });
    if (shown === 0) document.querySelector('[data-empty]').hidden = false;

    // 이미지가 전부 16:9(1920x1080 비율)이면 한 장씩 딱 맞춰 스크롤합니다.
    // 다른 비율이 한 장이라도 섞이면 지금처럼 자유 스크롤로 둡니다.
    var shots169 = results.filter(function (r) { return r.pc.ok && !r.pc.clip; });
    var all169 = shots169.length > 0 && shots169.every(function (r) {
      var ratio = r.pc.w / r.pc.h; return ratio > 1.7 && ratio < 1.85;
    });
    if (all169) document.documentElement.classList.add('is-snap');

    // 확대 보기는 이미지가 붙은 다음에 연결합니다
    var tag = document.createElement('script');
    tag.src = '../assets/js/zoom.js';
    document.body.appendChild(tag);
  });
})();
</script>
<!-- 페이지 이동 — 맨 위 / 이전 장 / 다음 장 / 맨 아래
     스냅 스크롤에서 휠 민감도가 높은 마우스로 잘 안 넘어갈 때를 위한 보조 버튼입니다 -->
<nav class="pager" aria-label="페이지 이동">
  <button type="button" data-go="top" aria-label="맨 위로"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 2.5h10M8 13.5V5.5M4.5 9 8 5.5 11.5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></button>
  <button type="button" data-go="prev" aria-label="이전 장"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 13V3.5M4 7.5 8 3.5l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></button>
  <button type="button" data-go="next" aria-label="다음 장"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 3v9.5M4 8.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></button>
  <button type="button" data-go="bottom" aria-label="맨 아래로"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 13.5h10M8 2.5v8M4.5 7 8 10.5 11.5 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></button>
</nav>
<script>
(function () {
  var nav = document.querySelector('.pager');
  if (!nav) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var beh = reduce ? 'auto' : 'smooth';
  function items() {
    var list = [].slice.call(document.querySelectorAll('[data-stack] > picture, [data-stack] > video'));
    var nx = document.querySelector('.next'); if (nx) list.push(nx);
    return list;
  }
  function go(dir) {
    // 스냅 기준점 = 상단 고정 바를 뺀 영역의 가운데. 그냥 화면 가운데를 쓰면
    // 지금 멈춰 있는 장을 '다음'으로 골라 제자리에 머뭅니다.
    var pad = parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0;
    var mid = (window.innerHeight + pad) / 2, list = items(), t = null;
    if (dir > 0) { for (var i = 0; i < list.length; i++) { var r = list[i].getBoundingClientRect(); if (r.top + r.height / 2 > mid + 24) { t = list[i]; break; } } }
    else { for (var k = list.length - 1; k >= 0; k--) { var q = list[k].getBoundingClientRect(); if (q.top + q.height / 2 < mid - 24) { t = list[k]; break; } } }
    if (t) t.scrollIntoView({ behavior: beh, block: t.classList.contains('next') ? 'end' : 'center' });
    else window.scrollTo({ top: dir > 0 ? document.documentElement.scrollHeight : 0, behavior: beh });
  }
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var g = b.getAttribute('data-go');
    if (g === 'top') window.scrollTo({ top: 0, behavior: beh });
    else if (g === 'bottom') {
      // 맨 끝까지 내리면 마지막 장 윗부분이 잘립니다 — 마지막 장을 가운데에 둡니다
      var sl = document.querySelectorAll('[data-stack] > picture, [data-stack] > video');
      if (sl.length) sl[sl.length - 1].scrollIntoView({ behavior: beh, block: 'center' });
      else window.scrollTo({ top: document.documentElement.scrollHeight, behavior: beh });
    }
    else go(g === 'next' ? 1 : -1);
  });
  function state() {
    var y = window.scrollY, end = document.documentElement.scrollHeight - window.innerHeight - 4;
    nav.querySelector('[data-go="top"]').disabled = y < 4;
    nav.querySelector('[data-go="prev"]').disabled = y < 4;
    nav.querySelector('[data-go="next"]').disabled = y >= end;
    nav.querySelector('[data-go="bottom"]').disabled = y >= end;
  }
  window.addEventListener('scroll', state, { passive: true });
  window.addEventListener('resize', state);
  state();
})();
</script>
</body>
</html>
