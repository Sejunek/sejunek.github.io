<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laputa — Lab</title><link rel="icon" href="data:,"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Archivo,"Helvetica Neue",Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #2d45ff;outline-offset:-3px}.hint{position:fixed;bottom:18px;left:22px;right:22px;margin:0;color:#8a8a8a;font-size:11px;letter-spacing:1.2px;line-height:1.8;pointer-events:none;text-align:center}.status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#ffffffed;color:#8a8a8a;font-size:13px;line-height:1.8;padding:24px}.status[hidden]{display:none}progress{width:180px;height:3px;accent-color:#2d45ff;margin:14px auto}noscript{position:fixed;top:45%;width:100%;text-align:center}
</style></head><body>
<div class="status" role="status"><span id="message">라퓨타를 불러오는 중입니다.</span><progress aria-label="모델 로딩"></progress></div>
<p class="hint">드래그로 회전 · 휠 / 핀치로 확대 · 더블클릭으로 장소 탐색 · H 처음 시점</p>
<noscript>이 작품을 보려면 JavaScript를 켜주세요.</noscript>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
(()=>{'use strict';
const status=document.querySelector('.status'),message=document.querySelector('#message'),progress=document.querySelector('progress');
function fail(text){status.hidden=false;message.textContent=text;progress.hidden=true;}
if(!window.THREE||!THREE.OrbitControls||!THREE.GLTFLoader||!THREE.DRACOLoader){fail('3D 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인하고 다시 열어주세요.');return;}
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});}catch(e){fail('WebGL을 사용할 수 없습니다. 하드웨어 가속을 지원하는 브라우저에서 열어주세요.');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;document.body.prepend(renderer.domElement);
const canvas=renderer.domElement;canvas.tabIndex=0;canvas.setAttribute('aria-label','라퓨타 3D 탐색. 드래그와 방향키로 회전, 휠 또는 더하기 빼기로 확대, H로 처음 시점.');
const scene=new THREE.Scene();scene.background=new THREE.Color('#ffffff');const camera=new THREE.PerspectiveCamera(40,1,.05,1000);const controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=false;controls.enablePan=false;controls.rotateSpeed=.65;controls.zoomSpeed=.7;controls.minPolarAngle=.12;controls.maxPolarAngle=Math.PI*.85;
scene.add(new THREE.HemisphereLight(0xe8f2ff,0x73715f,.85));const key=new THREE.DirectionalLight(0xfff1d9,1.15);key.position.set(-30,55,35);scene.add(key);const fill=new THREE.DirectionalLight(0xdbe8ff,.35);fill.position.set(35,10,-30);scene.add(fill);
let model=null,radius=20,frame=0,loaded=false,contextLost=false;const homeTarget=new THREE.Vector3(),homePosition=new THREE.Vector3();
const stats=window.laputaStats={ready:false,frames:0,calls:0,triangles:0};
function draw(){frame=0;if(document.hidden||contextLost)return;renderer.render(scene,camera);stats.frames++;stats.calls=renderer.info.render.calls;stats.triangles=renderer.info.render.triangles;}
function invalidate(){if(!frame&&!document.hidden&&!contextLost)frame=requestAnimationFrame(draw);}
controls.addEventListener('change',invalidate);
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/Math.max(1,innerHeight);camera.updateProjectionMatrix();if(loaded){setHome();}invalidate();}
function setHome(){const fov=THREE.MathUtils.degToRad(camera.fov),lim=Math.min(fov,2*Math.atan(Math.tan(fov/2)*camera.aspect)),distance=radius/Math.sin(lim/2)*.76;homePosition.copy(homeTarget).add(new THREE.Vector3(1,.48,1).normalize().multiplyScalar(distance));controls.maxDistance=distance*2;}
function home(){controls.target.copy(homeTarget);camera.position.copy(homePosition);controls.update();invalidate();}
const decoder=new THREE.DRACOLoader();decoder.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/gltf/');decoder.setWorkerLimit(2);const loader=new THREE.GLTFLoader();loader.setDRACOLoader(decoder);
loader.load('../../assets/models/lab/laputa-web.glb',g=>{model=g.scene;const box=new THREE.Box3().setFromObject(model),sphere=box.getBoundingSphere(new THREE.Sphere());radius=sphere.radius;homeTarget.copy(sphere.center);scene.add(model);camera.near=radius/1500;camera.far=radius*30;camera.updateProjectionMatrix();controls.minDistance=radius*.12;loaded=true;setHome();home();status.hidden=true;stats.ready=true;stats.meshes=0;model.traverse(o=>{if(o.isMesh)stats.meshes++;});decoder.dispose();},e=>{if(e.lengthComputable){progress.max=e.total;progress.value=e.loaded;message.textContent='라퓨타를 불러오는 중 · '+Math.round(e.loaded/e.total*100)+'%';}},()=>{decoder.dispose();fail('모델을 불러오지 못했습니다. 네트워크 연결을 확인한 후 다시 열어주세요.');});
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();canvas.addEventListener('dblclick',e=>{if(!model)return;const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObject(model,true)[0];if(!hit)return;const direction=camera.position.clone().sub(hit.point).normalize();controls.target.copy(hit.point);camera.position.copy(hit.point).addScaledVector(direction,radius*.65);controls.update();invalidate();});
canvas.addEventListener('keydown',e=>{if(!loaded)return;const offset=camera.position.clone().sub(controls.target),s=new THREE.Spherical().setFromVector3(offset);if(e.key.toLowerCase()==='h'){e.preventDefault();home();return;}if(e.key==='ArrowLeft')s.theta-=.08;else if(e.key==='ArrowRight')s.theta+=.08;else if(e.key==='ArrowUp')s.phi-=.06;else if(e.key==='ArrowDown')s.phi+=.06;else if(e.key==='+'||e.key==='=')s.radius*=.9;else if(e.key==='-')s.radius*=1.1;else return;e.preventDefault();s.phi=THREE.MathUtils.clamp(s.phi,controls.minPolarAngle,controls.maxPolarAngle);s.radius=THREE.MathUtils.clamp(s.radius,controls.minDistance,controls.maxDistance);camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));controls.update();invalidate();});
canvas.addEventListener('pointerdown',()=>canvas.focus());canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();contextLost=true;cancelAnimationFrame(frame);frame=0;fail('그래픽 연결이 중단되었습니다. 복구를 기다리거나 뷰어에서 RESTART를 눌러주세요.');});canvas.addEventListener('webglcontextrestored',()=>{contextLost=false;if(loaded)status.hidden=true;invalidate();});
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);frame=0;if(!document.hidden)invalidate();});addEventListener('resize',resize);resize();
// 자동 회전·보간·배경 애니메이션 없이 입력이 있을 때만 렌더링합니다.
// prefers-reduced-motion에서도 동일하게 정지 화면을 유지합니다.
})();
</script></body></html>
