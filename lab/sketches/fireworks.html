<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fireworks — Lab</title><link rel="icon" href="data:,">
<style>
html,body,canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:fixed;left:0;right:0;bottom:16px;margin:0;text-align:center;color:#666;
  font:11px/1.6 Archivo,"Helvetica Neue",Arial,sans-serif;letter-spacing:1.2px;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>
<canvas aria-label="검은 화면. 클릭하거나 터치한 자리에서 색색의 불꽃이 사방으로 퍼집니다."></canvas>
<p class="hint">CLICK / TAP · 누른 자리에서 불꽃이 터집니다</p>
<script>
/* 원작: Processing (대학 시절 작업)
   옮기면서 바꾼 것
   - 배열을 앞에서부터 지우며 돌면 한 칸씩 건너뛰던 문제 → 뒤에서부터, 맨 끝과 바꿔 지우기
   - 1000x1000 고정 → 화면 크기에 맞춤. 속도·크기도 화면 비율로 환산
   - 프레임마다 같은 거리 → 경과 시간 기준 (고주사율 모니터에서도 같은 속도)
   - 연타해도 버티도록 입자 수 상한
   - 탭이 안 보이면 멈춤, 레티나는 2배까지만 */
(() => {
  const cv = document.querySelector('canvas'), ctx = cv.getContext('2d', { alpha: false });
  const hint = document.querySelector('.hint');
  const NUM = 80, MAX = 2400;
  let W = 0, H = 0, S = 1, dpr = 1, raf = 0, last = 0;
  const P = [];   // {x,y,dx,dy,r,c}

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H) / 1000;              // 원본 1000px 기준 비율
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  function burst(x, y) {
    for (let i = 0; i < NUM; i++) {
      if (P.length >= MAX) P.shift();
      P.push({ x, y, dx: rnd(-20, 20) * S, dy: rnd(-20, 20) * S, r: rnd(1, 20) * S / 2,
        c: 'rgb(' + (Math.random() * 256 | 0) + ',' + (Math.random() * 256 | 0) + ',' + (Math.random() * 256 | 0) + ')' });
    }
    if (hint) hint.style.opacity = 0;
    if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
  }

  function frame(t) {
    const k = last ? Math.min((t - last) / (1000 / 60), 3) : 1;   // 60fps 한 프레임 = 1
    last = t;
    // 잔상 — 원본의 fill(0,20) rect
    ctx.fillStyle = 'rgba(0,0,0,' + (1 - Math.pow(1 - 20 / 255, k)) + ')';
    ctx.fillRect(0, 0, W, H);
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) { P[i] = P[P.length - 1]; P.pop(); continue; }
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      p.x += p.dx * k; p.y += p.dy * k;
    }
    // 불꽃이 다 빠져나가도 잔상이 사라질 때까지 조금 더 돌고 멈춤
    if (P.length || (frame.tail = (frame.tail || 0) + 1) < 90) raf = requestAnimationFrame(frame);
    else { raf = 0; frame.tail = 0; }
    if (P.length) frame.tail = 0;
  }

  cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); burst(e.clientX - r.left, e.clientY - r.top); });
  addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (P.length && !raf) { last = 0; raf = requestAnimationFrame(frame); }
  });
  addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
