<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>무너진 자리</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#fff;color:#111;font-family:'Helvetica Neue',Arial,sans-serif}canvas{display:block;touch-action:none}#hint{position:fixed;bottom:24px;left:28px;right:28px;color:#8a8a8a;font-size:11px;letter-spacing:1.2px;pointer-events:none;line-height:1.8}#pause{position:fixed;right:28px;bottom:25px;background:white;border:0;color:#888;font:11px Arial;letter-spacing:1px;padding:8px;cursor:pointer}@media(max-width:600px){#hint{bottom:56px;left:20px;right:20px;font-size:10px}}</style><canvas aria-label="누르거나 스페이스를 길게 눌러 구조물을 쌓습니다. 무너진 조각은 다음 구조물의 바닥이 됩니다." tabindex="0"></canvas><div id="hint">길게 눌러 쌓기 · 놓아서 맡기기 · 무너진 자리에서 다시 시작</div><button id="pause">PAUSE</button><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)');let w,h,floor,dpr,parts=[],active=[],held=false,px=0,t=0,frame=0,last=0,acc=0,grow=0,attempt=0,paused=false,wind=0;const L=15;
function resize(){const old=floor||innerHeight*.77;w=innerWidth;h=innerHeight;floor=h*.77;dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';g.setTransform(dpr,0,0,dpr,0,0);for(const p of parts){p.y+=floor-old;p.oy+=floor-old}draw()}
function surface(x){let y=floor;for(const p of parts)if(Math.abs(p.x-x)<12&&p.y>floor-150)y=Math.min(y,p.y-6);return y}
function begin(x){if(paused||reduce.matches)return;held=true;px=Math.max(30,Math.min(w-30,x));attempt++;const y=surface(px);active=[{x:px,y,ox:px,oy:y,pin:true,alive:true,age:0}];parts.push(active[0]);grow=.12;wake()}
function release(){held=false;for(const p of active){p.pin=false;p.alive=false}active=[]}
function step(){t+=1/60;wind=Math.sin(t*.83)*.026+Math.sin(t*2.1)*.009;if(held){grow+=1/60;if(grow>.115){grow=0;let a=active.at(-1);if(a){const p={x:a.x+Math.sin(t*2)*.5,y:a.y-L,ox:a.x,oy:a.y-L,pin:false,alive:true,parent:a,age:0};active.push(p);parts.push(p)}if(active.length>Math.min(30,h/18)||parts.length>380)release()}}
for(const p of parts){p.age++;if(p.pin)continue;let vx=(p.x-p.ox)*.985,vy=(p.y-p.oy)*.985;p.ox=p.x;p.oy=p.y;p.x+=vx+(p.alive?wind*(active.indexOf(p)+1):wind*.3);p.y+=vy+.075;}
for(let k=0;k<7;k++){for(const p of parts){let a=p.parent;if(!a)continue;let dx=p.x-a.x,dy=p.y-a.y,dist=Math.hypot(dx,dy)||1;let correction=(dist-L)/dist*.5;if(!p.pin){p.x-=dx*correction;p.y-=dy*correction}if(!a.pin){a.x+=dx*correction;a.y+=dy*correction}}
for(const p of parts){if(p.pin)continue;if(p.y>floor){p.y=floor;p.oy=floor+(p.y-p.oy)*.12;p.ox=p.x-(p.x-p.ox)*.65}p.x=Math.max(8,Math.min(w-8,p.x));}
}
// A growing column slowly loses its alignment: it can carry height, never certainty.
if(held&&active.length>2){for(let i=1;i<active.length;i++){const p=active[i],a=active[i-1];p.x+=(a.x-p.x)*.012;p.y+=(a.y-L-p.y)*Math.max(0,.12-i*.004)}let tip=active.at(-1);if(Math.abs(tip.x-px)>Math.max(30,active.length*1.7)||tip.y<60)release()}
// Settled fragments retain spacing through their links; each later attempt finds their upper surface.
if(parts.length>380){const trim=parts.splice(0,80);for(const p of parts)if(trim.includes(p.parent))p.parent=null;}
}
function draw(){g.clearRect(0,0,w,h);g.fillStyle='#fafaf8';g.fillRect(0,floor,w,h-floor);g.strokeStyle='#deded9';g.lineWidth=1;g.beginPath();g.moveTo(0,floor+.5);g.lineTo(w,floor+.5);g.stroke();
g.save();g.strokeStyle='#efefec';g.setLineDash([2,7]);for(let y=floor-90;y>60;y-=90){g.beginPath();g.moveTo(w*.12,y);g.lineTo(w*.88,y);g.stroke()}g.restore();
for(const p of parts){if(p.parent){g.lineWidth=p.alive?3:2;g.strokeStyle=p.alive?'#2D45FF':'#353534';g.beginPath();g.moveTo(p.parent.x,p.parent.y);g.lineTo(p.x,p.y);g.stroke()}g.beginPath();g.arc(p.x,p.y,p.alive?2.2:1.6,0,Math.PI*2);g.fillStyle=p.alive?'#2D45FF':'#888881';g.fill()}
if(!parts.length){g.strokeStyle='#2d45ff';g.lineWidth=1;g.beginPath();g.arc(w/2,floor,7,Math.PI,0);g.stroke();g.fillStyle='#8a8a8a';g.font='12px Arial';g.textAlign='center';g.fillText(reduce.matches?'정지된 장면 · 움직임 줄이기 설정 적용 중':'어디에서 시작할까',w/2,floor+35)}
if(attempt){g.fillStyle='#aaa';g.font='10px Arial';g.textAlign='left';g.fillText(String(attempt).padStart(2,'0')+' 번의 시작',28,35)}
}
function loop(ts){frame=0;if(document.hidden||paused||reduce.matches)return;const dt=last?Math.min((ts-last)/1000,.05):1/60;last=ts;acc+=dt;while(acc>=1/60){step();acc-=1/60}draw();frame=requestAnimationFrame(loop)}function wake(){if(!frame&&!document.hidden&&!paused&&!reduce.matches){last=0;frame=requestAnimationFrame(loop)}}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);release();begin(e.clientX)});c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(!e.repeat)begin(w/2)}});addEventListener('keyup',e=>{if(e.code==='Space')release()});addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{release();cancelAnimationFrame(frame);frame=0;if(!document.hidden)wake()});document.querySelector('#pause').onclick=()=>{paused=!paused;release();cancelAnimationFrame(frame);frame=0;document.querySelector('#pause').textContent=paused?'RESUME':'PAUSE';wake()};reduce.addEventListener('change',()=>{release();cancelAnimationFrame(frame);frame=0;draw();wake()});addEventListener('resize',resize);resize();wake();window.study={get count(){return parts.length},get attempts(){return attempt}};
</script></html>
