<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>별 헤는 밤 — Lab</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:#e8ecf5;
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
canvas:focus-visible{outline:2px solid #2d45ff;outline-offset:-3px}
footer{position:absolute;bottom:22px;left:28px;right:28px;display:flex;
  justify-content:space-between;align-items:flex-end;gap:16px;
  pointer-events:none;font-size:11px;letter-spacing:1.2px;color:#5a6479}
#word{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  font-size:13px;letter-spacing:0;color:#aeb8cd;opacity:0;
  transition:opacity 900ms ease}
#word.on{opacity:1}
#fallback{position:absolute;top:50%;width:100%;text-align:center;color:#6b7489}
#fallback[hidden]{display:none}
@media(max-width:600px){footer{left:18px;right:18px;bottom:16px;font-size:10px}}
@media(max-height:420px){footer{bottom:12px}}
</style>
</head>
<body>
<canvas tabindex="0" aria-label="밤하늘. 화면을 누르고 있으면 희미한 별들이 모여 형상을 이루고, 손을 떼면 흩어지며 밝은 별 하나가 남습니다."></canvas>
<footer>
  <span>PRESS AND HOLD &middot; 누르고 있으면 별이 모입니다</span>
  <span id="word"></span>
</footer>
<p id="fallback" hidden>Canvas를 지원하는 브라우저에서 열어주세요.</p>
<noscript>이 스케치를 실행하려면 JavaScript를 켜주세요.</noscript>
<script>
(()=>{'use strict';
const canvas=document.querySelector('canvas');
const ctx=canvas.getContext('2d',{alpha:false});
if(!ctx){document.querySelector('#fallback').hidden=false;return;}
const wordEl=document.querySelector('#word');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');

let w=1,h=1,dpr=1,raf=0,last=0,t=0;

/* ---------- 별 ----------
   희미한 별이 다수, 밝은 별은 소수.
   형상을 만드는 것은 희미한 별들이고, 밝은 별은 '남은 기억'입니다. */
const FAINT=760;
let faint=[], bright=[];

function seedStars(){
  faint=[];
  for(let i=0;i<FAINT;i++){
    const x=Math.random()*w, y=Math.random()*h*0.9;
    faint.push({
      hx:x, hy:y,          // 제자리
      x, y,                // 현재
      vx:0, vy:0,
      tx:0, ty:0,          // 모일 목표
      on:false,            // 목표를 향하는 중인가
      base:0.05+Math.random()*0.22,
      glow:0,
      tw:Math.random()*6.28, tws:0.4+Math.random()*1.1,
      r:Math.random()<0.12?1.15:0.75
    });
  }
  bright=[];
  const n=6;
  for(let i=0;i<n;i++) bright.push(makeBright(
    w*(0.06+Math.random()*0.88), h*(0.06+Math.random()*0.6)));
}
function makeBright(x,y){
  return { x,y, r:1.5+Math.random()*1.1, tw:Math.random()*6.28,
           tws:0.5+Math.random()*0.9, born:1 };
}

/* ---------- 형상 ----------
   고정된 그림이 아니라 매번 다른 곡선을 만듭니다.
   같은 모양이 두 번 나오지 않습니다. */
const FORMS=[
  // 장미곡선
  (n)=>{const k=[3,4,5,6,7][(Math.random()*5)|0], p=[];
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2*((k%2)?1:1);
      const r=Math.cos(k*a); p.push([Math.cos(a)*r, Math.sin(a)*r]);} return p;},
  // 리사주
  (n)=>{const a=1+((Math.random()*4)|0), b=1+((Math.random()*4)|0),
      d=Math.random()*Math.PI, p=[];
    for(let i=0;i<n;i++){const u=i/n*Math.PI*2;
      p.push([Math.sin(a*u+d), Math.sin(b*u)]);} return p;},
  // 별 다각형
  (n)=>{const pts=5+((Math.random()*4)|0), inner=0.36+Math.random()*0.2, p=[];
    for(let i=0;i<n;i++){const u=i/n*Math.PI*2;
      const seg=Math.cos(pts*u)*0.5+0.5, r=inner+(1-inner)*seg;
      p.push([Math.cos(u)*r, Math.sin(u)*r]);} return p;},
  // 나선
  (n)=>{const turns=2+Math.random()*2.5, p=[];
    for(let i=0;i<n;i++){const u=i/n, a=u*Math.PI*2*turns;
      p.push([Math.cos(a)*u, Math.sin(a)*u]);} return p;},
  // 초타원
  (n)=>{const e=0.4+Math.random()*2.2, p=[];
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2,c=Math.cos(a),s=Math.sin(a);
      p.push([Math.sign(c)*Math.pow(Math.abs(c),2/e),
              Math.sign(s)*Math.pow(Math.abs(s),2/e)]);} return p;},
  // 고리 + 흔들림
  (n)=>{const k=3+((Math.random()*6)|0), amp=0.1+Math.random()*0.25, p=[];
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2, r=1+Math.sin(k*a)*amp;
      p.push([Math.cos(a)*r, Math.sin(a)*r]);} return p;}
];

const WORDS=['별 하나에 추억과','별 하나에 사랑과','별 하나에 쓸쓸함과',
             '별 하나에 동경과','별 하나에 시와','별 하나에 어머니, 어머니'];

let holding=false, formCx=0, formCy=0;

// 윤곽선 안쪽을 별로 채웁니다 — 선이 아니라 면이라야 실루엣으로 보입니다
function inside(poly, x, y){
  let hit=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i], [xj,yj]=poly[j];
    if((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) hit=!hit;
  }
  return hit;
}
function sampleForm(count){
  const make=FORMS[(Math.random()*FORMS.length)|0];
  const poly=make(180);
  const pts=[];
  // 테두리에 일부를 먼저 얹어 윤곽을 또렷하게
  const edge=Math.round(count*0.30);
  for(let i=0;i<edge;i++){
    const p=poly[(i*poly.length/edge|0)%poly.length];
    pts.push([p[0]+(Math.random()-0.5)*0.03, p[1]+(Math.random()-0.5)*0.03]);
  }
  // 나머지는 내부를 채웁니다
  let guard=0;
  while(pts.length<count && guard<count*40){
    guard++;
    const x=Math.random()*2-1, y=Math.random()*2-1;
    if(inside(poly,x,y)) pts.push([x,y]);
  }
  // 내부가 거의 없는 형상(나선 등)이면 테두리로 채웁니다
  while(pts.length<count){
    const p=poly[(Math.random()*poly.length)|0];
    pts.push([p[0]+(Math.random()-0.5)*0.05, p[1]+(Math.random()-0.5)*0.05]);
  }
  return pts;
}

function gather(px,py){
  const R=Math.min(w,h)*(0.15+Math.random()*0.06);
  formCx=Math.max(R*1.15,Math.min(w-R*1.15,px));
  formCy=Math.max(R*1.15,Math.min(h*0.76-R*0.15,py));
  const count=Math.min(FAINT, 340+((Math.random()*180)|0));
  const pts=sampleForm(count);
  const rot=Math.random()*Math.PI*2, cr=Math.cos(rot), sr=Math.sin(rot);
  // 가까운 별부터 목표를 받습니다 — 자연스럽게 모입니다
  const order=faint.map((s,i)=>i).sort((a,b)=>
    ((faint[a].x-formCx)**2+(faint[a].y-formCy)**2) -
    ((faint[b].x-formCx)**2+(faint[b].y-formCy)**2));
  for(const s of faint) s.on=false;
  for(let i=0;i<count;i++){
    const s=faint[order[i]], [ux,uy]=pts[i];
    s.tx=formCx+(ux*cr-uy*sr)*R;
    s.ty=formCy+(ux*sr+uy*cr)*R;
    s.on=true;
    s.lift=0.35+Math.random()*0.65;   // 모였을 때 밝기를 별마다 다르게
  }
}
function release(){
  for(const s of faint) s.on=false;
  // 모였던 기억이 밝은 별 하나로 남습니다
  bright.push(makeBright(formCx,formCy));
  if(bright.length>14) bright.shift();
  wordEl.textContent=WORDS[(Math.random()*WORDS.length)|0];
  wordEl.classList.add('on');
  clearTimeout(release._t);
  release._t=setTimeout(()=>wordEl.classList.remove('on'),2600);
}

/* ---------- 지상 실루엣 ---------- */
function groundY(){ return h*0.88; }
function figScale(){ return Math.min(h*0.105, w*0.062); }

function drawFigure(){
  // 뒷모습만. 색 없음. 하늘에 비해 아주 작게.
  const s=figScale(), gx=w*0.43, gy=groundY();
  const U=s/100;                       // 100 단위로 그리고 줄입니다
  ctx.save();
  ctx.translate(gx,gy); ctx.scale(U,U);
  ctx.fillStyle='#010206';

  // 다리 둘 — 사이를 띄워야 사람으로 읽힙니다
  ctx.fillRect(-13, -42, 10, 43);
  ctx.fillRect(  3, -42, 10, 43);
  // 몸통 — 어깨가 넓고 허리로 좁아지는 외투
  ctx.beginPath();
  ctx.moveTo(-15,-40);
  ctx.lineTo(-17,-72);
  ctx.quadraticCurveTo(-18,-80,-10,-83);
  ctx.lineTo(10,-83);
  ctx.quadraticCurveTo(18,-80,17,-72);
  ctx.lineTo(15,-40);
  ctx.closePath(); ctx.fill();
  // 팔 — 몸에 붙여 실루엣 윤곽만
  ctx.beginPath();
  ctx.moveTo(-17,-78); ctx.quadraticCurveTo(-23,-66,-20,-50);
  ctx.lineTo(-14,-50); ctx.lineTo(-15,-76); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(17,-78); ctx.quadraticCurveTo(23,-66,20,-50);
  ctx.lineTo(14,-50); ctx.lineTo(15,-76); ctx.closePath(); ctx.fill();
  // 목과 머리
  ctx.fillRect(-4,-89,8,8);
  ctx.beginPath();
  ctx.ellipse(0,-97, 9.5, 10.5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawTree(sway){
  const s=figScale()*1.75, gx=w*0.565, gy=groundY();
  ctx.fillStyle='#020307';
  ctx.strokeStyle='#020307';
  ctx.lineCap='round';
  // 줄기 — 위로 갈수록 바람에 더 휩니다
  ctx.lineWidth=Math.max(1.2, s*0.045);
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.quadraticCurveTo(gx+sway*s*0.10, gy-s*0.45, gx+sway*s*0.22, gy-s*0.78);
  ctx.stroke();
  // 가지
  const tipx=gx+sway*s*0.22, tipy=gy-s*0.78;
  const br=[[-0.30,-0.16,0.55],[0.28,-0.20,0.50],[-0.18,-0.34,0.42],[0.20,-0.36,0.40]];
  ctx.lineWidth=Math.max(0.9, s*0.022);
  for(const [dx,dy,f] of br){
    const bx=gx+sway*s*0.16*f, by=gy-s*0.78*f-s*0.06;
    ctx.beginPath(); ctx.moveTo(bx,by);
    ctx.quadraticCurveTo(bx+dx*s*0.5, by+dy*s*0.5,
                         bx+dx*s*0.95+sway*s*0.10, by+dy*s*0.95);
    ctx.stroke();
  }
  // 잎 덩어리 — 크기와 각도를 흩어 자연스럽게
  const blobs=[[  0.00,-0.16,0.30,0.21,-0.2],[-0.23,-0.05,0.22,0.15, 0.35],
               [ 0.22,-0.07,0.21,0.14,-0.3],[-0.11,-0.28,0.20,0.14, 0.15],
               [ 0.13,-0.27,0.18,0.13,-0.1],[-0.32,-0.16,0.14,0.10, 0.5],
               [ 0.31,-0.18,0.13,0.10,-0.45],[ 0.02,-0.36,0.13,0.09, 0.1]];
  for(const [dx,dy,rx,ry,rot] of blobs){
    ctx.beginPath();
    ctx.ellipse(tipx+dx*s+sway*s*0.06*(1-dy), tipy+dy*s,
                rx*s, ry*s, rot+sway*0.05, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawGround(){
  const gy=groundY();
  ctx.fillStyle='#020307';
  ctx.beginPath();
  ctx.moveTo(0,h);
  ctx.lineTo(0,gy+h*0.012);
  // 아주 완만한 언덕
  ctx.quadraticCurveTo(w*0.3, gy-h*0.016, w*0.55, gy);
  ctx.quadraticCurveTo(w*0.8, gy+h*0.012, w, gy-h*0.006);
  ctx.lineTo(w,h);
  ctx.closePath(); ctx.fill();
}

/* ---------- 렌더 ---------- */
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // 하늘 — 위가 더 깊고 지평선이 아주 조금 밝습니다
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#04060c');
  g.addColorStop(0.7,'#070b16');
  g.addColorStop(1,'#0b1020');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  // 희미한 별 — 밝기 단계로 묶어서 한 번에 그립니다
  const buckets=new Map();
  for(const s of faint){
    const tw=0.75+Math.sin(t*s.tws+s.tw)*0.25;
    const a=Math.min(1,(s.base+s.glow*0.55)*tw);
    const key=Math.round(a*14);
    if(!buckets.has(key)) buckets.set(key,[]);
    buckets.get(key).push(s);
  }
  for(const [key,list] of buckets){
    const a=key/14;
    if(a<=0.012) continue;
    ctx.fillStyle='rgba(200,214,240,'+a.toFixed(3)+')';
    ctx.beginPath();
    for(const s of list){
      const r=s.r*(1+s.glow*0.8);
      ctx.moveTo(s.x+r, s.y);
      ctx.arc(s.x, s.y, r, 0, Math.PI*2);
    }
    ctx.fill();
  }

  // 밝은 별 — 소수. 빛무리와 십자 섬광.
  for(const b of bright){
    const tw=0.68+Math.sin(t*b.tws+b.tw)*0.32;
    const r=b.r*b.born;
    const rg=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r*9);
    rg.addColorStop(0,'rgba(226,234,255,'+(0.85*tw).toFixed(3)+')');
    rg.addColorStop(0.18,'rgba(150,175,245,'+(0.28*tw).toFixed(3)+')');
    rg.addColorStop(1,'rgba(45,69,255,0)');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(b.x,b.y,r*9,0,Math.PI*2); ctx.fill();

    ctx.strokeStyle='rgba(219,229,255,'+(0.5*tw).toFixed(3)+')';
    ctx.lineWidth=0.7;
    const L=r*4.2*tw;
    ctx.beginPath();
    ctx.moveTo(b.x-L,b.y); ctx.lineTo(b.x+L,b.y);
    ctx.moveTo(b.x,b.y-L); ctx.lineTo(b.x,b.y+L);
    ctx.stroke();

    ctx.fillStyle='rgba(255,255,255,'+(0.95*tw).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.fill();
  }

  drawGround();
  const sway=reduce.matches?0:Math.sin(t*0.55)*0.6+Math.sin(t*1.31+1.1)*0.22;
  drawTree(sway);
  drawFigure();
}

function step(dt){
  t+=dt;
  for(const s of faint){
    const tx=s.on?s.tx:s.hx, ty=s.on?s.ty:s.hy;
    const k=s.on?7.2:1.5;                  // 모일 때 빠르고, 흩어질 때 느리게
    const a=1-Math.exp(-k*dt);
    s.x+=(tx-s.x)*a; s.y+=(ty-s.y)*a;
    const want=s.on?(s.lift||1):0;
    s.glow+=(want-s.glow)*(1-Math.exp(-(s.on?6:2)*dt));
  }
  for(const b of bright) if(b.born<1) b.born=Math.min(1,b.born+dt*1.6);
}

function frame(time){
  raf=0;
  if(document.hidden) return;
  const dt=last?Math.min((time-last)/1000,0.05):1/60;
  last=time;
  if(reduce.matches){ draw(); return; }
  step(dt); draw();
  raf=requestAnimationFrame(frame);
}
function start(){ if(!raf&&!document.hidden) raf=requestAnimationFrame(frame); }

function resize(){
  w=innerWidth; h=innerHeight;
  dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  seedStars();
  if(reduce.matches){ draw(); } else start();
}

/* ---------- 입력 ---------- */
let pid=null;
function pos(e){
  const r=canvas.getBoundingClientRect();
  return [e.clientX-r.left, e.clientY-r.top];
}
canvas.addEventListener('pointerdown',e=>{
  if(pid!==null) return;
  pid=e.pointerId; canvas.setPointerCapture(pid); canvas.focus();
  holding=true;
  const [x,y]=pos(e); gather(x,y);
  if(reduce.matches){ for(const s of faint) if(s.on){s.x=s.tx;s.y=s.ty;s.glow=1;} draw(); }
  else start();
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId!==pid||!holding) return;
  const [x,y]=pos(e), dx=x-formCx, dy=y-formCy;
  formCx=x; formCy=y;
  for(const s of faint) if(s.on){ s.tx+=dx; s.ty+=dy; }
});
function up(e){
  if(e.pointerId!==pid) return;
  pid=null;
  if(holding){ holding=false; release();
    if(reduce.matches){ for(const s of faint){s.x=s.hx;s.y=s.hy;s.glow=0;} draw(); } }
}
canvas.addEventListener('pointerup',up);
canvas.addEventListener('pointercancel',up);
canvas.addEventListener('lostpointercapture',up);
// 키보드 — 스페이스로 같은 동작
canvas.addEventListener('keydown',e=>{
  if(e.key!==' '&&e.key!=='Enter') return;
  e.preventDefault();
  if(holding) return;
  holding=true; gather(w*(0.25+Math.random()*0.5), h*(0.2+Math.random()*0.35));
  start();
});
canvas.addEventListener('keyup',e=>{
  if(e.key!==' '&&e.key!=='Enter'||!holding) return;
  holding=false; release();
});

document.addEventListener('visibilitychange',()=>{
  cancelAnimationFrame(raf); raf=0; last=0;
  if(!document.hidden) start();
});
reduce.addEventListener('change',()=>{
  cancelAnimationFrame(raf); raf=0; last=0;
  if(reduce.matches) draw(); else start();
});
addEventListener('resize',resize);
resize();
})();
</script>
</body></html>
