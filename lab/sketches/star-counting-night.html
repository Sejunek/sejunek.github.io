function tick(now){frame=0;if(document.hidden)return;const dt=last?Math.min((now-last)/1000,.05):0;last=now;paint(dt);if(!paused&&!reduced.matches)invalidate();else last=0;}
function invalidate(){if(!document.hidden&&!frame)frame=requestAnimationFrame(tick);}
function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);background();const prev=progress;setTargets();if(active<0||prev===1){particles.forEach(p=>{p.x=p.sx=p.tx;p.y=p.sy=p.ty;});progress=1;}invalidate();}
canvas.addEventListener('pointermove',e=>{if(reduced.matches)return;mouse.x=e.clientX/width-.5;mouse.y=e.clientY/height-.5;});canvas.addEventListener('pointerleave',()=>{mouse.x=mouse.y=0;});canvas.addEventListener('click',()=>choose(-1));canvas.addEventListener('keydown',e=>{if(e.key==='Escape')choose(-1);if(['1','2','3'].includes(e.key))choose(Number(e.key)-1);});
pauseButton.addEventListener('click',()=>{paused=!paused;pauseButton.textContent=paused?'RESUME':'PAUSE';pauseButton.setAttribute('aria-pressed',String(paused));last=0;invalidate();});function syncMotion(){if(reduced.matches){particles.forEach(p=>{p.x=p.sx=p.tx;p.y=p.sy=p.ty;});progress=1;pauseButton.hidden=true;}else pauseButton.hidden=false;cancelAnimationFrame(frame);frame=0;last=0;invalidate();}reduced.addEventListener('change',syncMotion);document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);frame=0;last=0;if(!document.hidden)invalidate();});addEventListener('resize',resize);
document.querySelector('#name').addEventListener('click',()=>dialog.showModal());document.querySelector('#cancel').addEventListener('click',()=>dialog.close());document.querySelector('#name-form').addEventListener('submit',e=>{e.preventDefault();const value=document.querySelector('#memory-name').value.trim();if(!value)return;const c=document.createElement('canvas');c.width=900;c.height=680;const pen=c.getContext('2d');pen.fillStyle='white';pen.textAlign='center';pen.textBaseline='middle';pen.font='500 '+Math.min(150,660/Math.max(1,[...value].length))+'px "AppleMyungjo", "Batang", serif';pen.fillText(value,450,365);const data=pen.getImageData(0,0,900,680).data,points=[];for(let y=180;y<540;y+=3)for(let x=60;x<840;x+=3)if(data[(y*900+x)*4+3]>100)points.push({x,y});if(!points.length)return;customPoints=Array.from({length:N},(_,i)=>points[Math.floor(i*points.length/N)]);dialog.close();choose(3);});
resize();syncMotion();
})();
