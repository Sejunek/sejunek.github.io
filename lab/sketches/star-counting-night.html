*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e20;color:#e4e8ef;font-family:Archivo,"Helvetica Neue",Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:1px solid #8095ff;outline-offset:7px}.choices{position:fixed;inset:auto 12% 76px;display:flex;justify-content:space-between;pointer-events:none}.star{pointer-events:auto;background:none;border:0;color:#99a4bb;min-width:64px;min-height:66px;padding:10px 12px;font-family:"AppleMyungjo","Batang",serif;font-size:13px;letter-spacing:4px;transition:color .6s}.star::before{content:"✧";display:block;font-family:Arial,sans-serif;font-size:24px;line-height:1.3;color:#bbc9ea;text-shadow:0 0 18px #829aff}.star[aria-pressed="true"]{color:#fff0d2}.star[aria-pressed="true"]::before{content:"✦";color:#e6cf9c}.star[data-seen="true"]::after{content:"·";display:block;position:absolute;margin-left:25px;color:#dbc89c}.hint{position:fixed;bottom:21px;left:20px;right:20px;text-align:center;font-size:11px;letter-spacing:1.2px;line-height:1.8;color:#8a8fa2;pointer-events:none;margin:0}.tools{position:fixed;top:22px;right:24px;display:flex;gap:18px}.tools button{border:0;background:none;color:#a2acc0;font-size:10px;letter-spacing:1.2px;padding:10px 0}.tools button[hidden]{display:none}.caption{position:fixed;top:13%;left:0;right:0;text-align:center;pointer-events:none;font-family:"AppleMyungjo","Batang",serif;color:#e6dfd3;font-size:clamp(19px,2.2vw,28px);letter-spacing:.5em;opacity:0;transition:opacity 1s}.caption.visible{opacity:1}.caption small{display:block;margin-top:17px;font-family:Archivo,Arial,sans-serif;color:#838da5;font-size:9px;letter-spacing:3px}.fallback{position:fixed;top:43%;left:10%;right:10%;text-align:center;font-size:14px;line-height:1.8;color:#c9c9c6}.fallback[hidden]{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{background:#10192bf5;color:#e4e8ef;border:1px solid #303c57;padding:28px;width:min(340px,85vw);box-shadow:0 20px 100px #0008}dialog::backdrop{background:#02050da0}dialog label{display:block;font-family:"AppleMyungjo","Batang",serif;letter-spacing:2px;margin-bottom:19px}dialog input{width:100%;padding:10px 0;border:0;border-bottom:1px solid #60708f;color:#fff;background:none;font-size:19px}dialog p{font-size:11px;color:#99a4bb;line-height:1.8}dialog div{display:flex;justify-content:flex-end;gap:20px;margin-top:24px}dialog button{border:0;background:none;color:#d6dfef;padding:8px;font-size:12px}svg{position:absolute;width:0;height:0;overflow:hidden}@media(max-width:500px){.choices{left:8%;right:8%;bottom:72px}.caption{top:16%}.tools{top:14px;right:20px}.star{font-size:12px;letter-spacing:3px}.hint{font-size:11px}.caption small{font-size:8px}}@media(max-height:480px){.caption{top:8%;font-size:18px}.caption small{display:none}.choices{left:5%;right:5%;bottom:37px}.star{min-height:48px;font-size:11px;padding:4px}.hint{bottom:9px}.tools{top:7px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<canvas id="sky" tabindex="0" aria-label="별빛으로 기억을 그리는 밤하늘. 아래 추억, 쓸쓸함, 어머니 별을 선택하세요. 빈 하늘 클릭 또는 Escape로 흩어집니다."></canvas>
<div class="caption" aria-hidden="true"><span id="word"></span><small id="verse"></small></div>

<div class="tools"><button id="name" hidden>이름 남기기</button><button id="pause" aria-pressed="false">PAUSE</button></div>
<p class="hint">별을 골라 잠시 머물러 보세요 · 빈 하늘을 누르면 다시 흩어집니다</p>
<p id="announce" class="sr" role="status" aria-live="polite"></p><p id="fallback" class="fallback" hidden>이 브라우저에서 Canvas를 사용할 수 없습니다.<br>다른 브라우저에서 열어주세요.</p>
<noscript><p class="fallback">이 밤하늘을 보려면 JavaScript를 켜주세요.</p></noscript>
<dialog id="dialog"><form id="name-form"><label for="memory-name">지금 떠오르는 이름</label><input id="memory-name" maxlength="12" autocomplete="off" required aria-describedby="privacy"><p id="privacy">이름은 이 화면에만 잠시 머뭅니다.<br>저장하거나 전송하지 않습니다.</p><div><button type="button" id="cancel">돌아가기</button><button type="submit">별로 남기기</button></div></form></dialog>
<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>

</g>

<g id="mother-paths">
<path d="M287 569C300 509 315 475 369 451C400 437 408 410 400 375C368 355 348 320 346 277C329 250 333 207 353 174C375 130 428 117 474 132C517 141 547 172 552 212C570 229 570 243 580 255L608 280Q610 291 588 294L594 309Q583 318 576 319L583 329Q579 341 563 346C560 365 550 379 529 378L489 366C479 393 483 420 514 442C558 465 591 494 614 569"/>

<path d="M349 245C329 257 318 278 325 298C334 317 353 318 365 306 M329 264Q345 263 354 279 M366 194Q390 175 416 193 M377 176Q409 158 441 184"/>
</g></defs></svg>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d',{alpha:false});if(!ctx){document.querySelector('#fallback').hidden=false;return;}
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),buttons=[...document.querySelectorAll('.star')],pauseButton=document.querySelector('#pause'),caption=document.querySelector('.caption'),word=document.querySelector('#word'),verse=document.querySelector('#verse'),announce=document.querySelector('#announce'),dialog=document.querySelector('#dialog');
const scenes=[{word:'추억',verse:'별 하나에 추억과',group:'memory-paths'},{word:'쓸쓸함',verse:'별 하나에 쓸쓸함과',group:'solitude-paths'},{word:'어머니',verse:'별 하나에 어머니, 어머니',group:'mother-paths'}];
let seed=1043;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}const N=1400,particles=[],field=[],seen=new Set();let width=1,height=1,dpr=1,bg,frame=0,last=0,time=0,progress=1,active=-1,paused=false,mouse={x:0,y:0},parallax={x:0,y:0},customPoints=[],targetPoints=[];
for(let i=0;i<N;i++)particles.push({x:random(),y:random(),sx:0,sy:0,tx:0,ty:0,ox:random(),oy:random(),phase:random()*Math.PI*2,size:.45+random()*.9,delay:random()*.19,arc:(random()-.5)*.28});for(let i=0;i<620;i++)field.push({x:random(),y:random(),size:.25+random()*.95,phase:random()*6,depth:.1+random()*.9});
function pathsToPoints(id){const paths=[...document.querySelectorAll('#'+id+' path')],lengths=paths.map(p=>p.getTotalLength()),total=lengths.reduce((a,b)=>a+b,0),points=[];for(let i=0;i<N;i++){let n=(i+.5)/N*total,j=0;while(j<paths.length-1&&n>lengths[j])n-=lengths[j++];const p=paths[j].getPointAtLength(n);points.push({x:p.x,y:p.y});}return points;}
const forms=scenes.map(s=>pathsToPoints(s.group));
function toScreen(p){const scale=Math.min(width/1020,height/850);return{x:width*.5+(p.x-450)*scale,y:height*.51+(p.y-365)*scale};}
function setTargets(){targetPoints=active===3?customPoints:active>=0?forms[active]:[];particles.forEach((p,i)=>{p.sx=p.x;p.sy=p.y;if(active<0){p.tx=p.ox;p.ty=p.oy;}else{const pt=toScreen(targetPoints[i%targetPoints.length]);p.tx=(pt.x+Math.sin(p.phase)*.8)/width;p.ty=(pt.y+Math.cos(p.phase)*.8)/height;}});progress=(reduced.matches||paused)?1:0;if(reduced.matches||paused)particles.forEach(p=>{p.x=p.tx;p.y=p.ty;});}
function choose(index){active=index;setTargets();window.nightStats.active=active;window.nightStats.progress=progress;buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));caption.classList.remove('visible');if(index>=0){announce.textContent=(index===3?document.querySelector('#memory-name').value.trim():scenes[index].word)+'의 별들이 모입니다.';}else announce.textContent='별들이 다시 밤하늘로 흩어집니다.';invalidate();}
buttons.forEach((b,i)=>b.addEventListener('click',()=>choose(active===i?-1:i)));
function background(){bg=document.createElement('canvas');bg.width=width;bg.height=height;const c=bg.getContext('2d');c.fillStyle='#080e20';c.fillRect(0,0,width,height);let g=c.createRadialGradient(width*.43,height*.48,0,width*.43,height*.48,width*.65);g.addColorStop(0,'#162239');g.addColorStop(.55,'#0c152b');g.addColorStop(1,'#070b19');c.fillStyle=g;c.fillRect(0,0,width,height);g=c.createRadialGradient(width*.74,height*.31,0,width*.74,height*.31,width*.34);g.addColorStop(0,'#493f551c');g.addColorStop(1,'#0c152b00');c.fillStyle=g;c.fillRect(0,0,width,height);}
function paint(dt){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(bg,0,0);const motion=!paused&&!reduced.matches;if(motion){time+=dt;progress=Math.min(1,progress+dt/(active<0?3:4.5));parallax.x+=(mouse.x-parallax.x)*Math.min(1,dt*2);parallax.y+=(mouse.y-parallax.y)*Math.min(1,dt*2);}else if(reduced.matches){parallax.x=parallax.y=0;progress=1;}
for(const s of field){const twinkle=.35+.2*Math.sin(time*.45+s.phase);ctx.fillStyle='rgba(171,193,231,'+twinkle+')';ctx.beginPath();ctx.arc(s.x*width+parallax.x*s.depth*7,s.y*height+parallax.y*s.depth*7,s.size,0,Math.PI*2);ctx.fill();}
for(let i=0;i<N;i++){const p=particles[i],t=Math.max(0,Math.min(1,(progress-p.delay)/(1-p.delay))),e=t*t*t*(t*(t*6-15)+10);p.x=p.sx+(p.tx-p.sx)*e+Math.sin(t*Math.PI)*p.arc*.45;p.y=p.sy+(p.ty-p.sy)*e+Math.sin(t*Math.PI)*p.arc;const flutter=motion?Math.sin(time*.7+p.phase):Math.sin(p.phase);const x=p.x*width+parallax.x*3,y=p.y*height+parallax.y*3,a=active>=0?.40+e*.32:.26;ctx.fillStyle=(i%7===0?'rgba(239,212,162,':'rgba(195,212,244,')+(a+flutter*.10)+')';ctx.beginPath();ctx.arc(x,y,p.size*(active>=0?1:.7),0,Math.PI*2);ctx.fill();if(i%47===0){const glow=ctx.createRadialGradient(x,y,0,x,y,10);glow.addColorStop(0,'rgba(182,207,255,.18)');glow.addColorStop(1,'rgba(122,155,255,0)');ctx.fillStyle=glow;ctx.fillRect(x-10,y-10,20,20);ctx.strokeStyle='rgba(218,227,251,.5)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+3,y);ctx.moveTo(x,y-3);ctx.lineTo(x,y+3);ctx.stroke();}}
if(active>=0&&progress>.8){word.textContent=active===3?document.querySelector('#memory-name').value.trim():scenes[active].word;verse.textContent=active===3?'당신이 떠올린 이름':scenes[active].verse;caption.classList.add('visible');if(active<3&&!seen.has(active)){seen.add(active);buttons[active].dataset.seen='true';if(seen.size===3)document.querySelector('#name').hidden=false;}}window.nightStats.frames++;window.nightStats.active=active;window.nightStats.progress=progress;}
window.nightStats={frames:0,active:-1,progress:1};
function tick(now){frame=0;if(document.hidden)return;const dt=last?Math.min((now-last)/1000,.05):0;last=now;paint(dt);if(!paused&&!reduced.matches)invalidate();else last=0;}
function invalidate(){if(!document.hidden&&!frame)frame=requestAnimationFrame(tick);}
function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);background();const prev=progress;setTargets();if(active<0||prev===1){particles.forEach(p=>{p.x=p.sx=p.tx;p.y=p.sy=p.ty;});progress=1;}invalidate();}
canvas.addEventListener('pointermove',e=>{if(reduced.matches)return;mouse.x=e.clientX/width-.5;mouse.y=e.clientY/height-.5;});canvas.addEventListener('pointerleave',()=>{mouse.x=mouse.y=0;});canvas.addEventListener('click',()=>choose(-1));canvas.addEventListener('keydown',e=>{if(e.key==='Escape')choose(-1);if(['1','2','3'].includes(e.key))choose(Number(e.key)-1);});
pauseButton.addEventListener('click',()=>{paused=!paused;pauseButton.textContent=paused?'RESUME':'PAUSE';pauseButton.setAttribute('aria-pressed',String(paused));last=0;invalidate();});function syncMotion(){if(reduced.matches){particles.forEach(p=>{p.x=p.sx=p.tx;p.y=p.sy=p.ty;});progress=1;pauseButton.hidden=true;}else pauseButton.hidden=false;cancelAnimationFrame(frame);frame=0;last=0;invalidate();}reduced.addEventListener('change',syncMotion);document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);frame=0;last=0;if(!document.hidden)invalidate();});addEventListener('resize',resize);
document.querySelector('#name').addEventListener('click',()=>dialog.showModal());document.querySelector('#cancel').addEventListener('click',()=>dialog.close());document.querySelector('#name-form').addEventListener('submit',e=>{e.preventDefault();const value=document.querySelector('#memory-name').value.trim();if(!value)return;const c=document.createElement('canvas');c.width=900;c.height=680;const pen=c.getContext('2d');pen.fillStyle='white';pen.textAlign='center';pen.textBaseline='middle';pen.font='500 '+Math.min(150,660/Math.max(1,[...value].length))+'px "AppleMyungjo", "Batang", serif';pen.fillText(value,450,365);const data=pen.getImageData(0,0,900,680).data,points=[];for(let y=180;y<540;y+=3)for(let x=60;x<840;x+=3)if(data[(y*900+x)*4+3]>100)points.push({x,y});if(!points.length)return;customPoints=Array.from({length:N},(_,i)=>points[Math.floor(i*points.length/N)]);dialog.close();choose(3);});
resize();syncMotion();
})();
</script></body></html>
