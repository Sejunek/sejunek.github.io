<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van Gogh's Perspective</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair; }
  .pick {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    color: #fff; font: 14px/1.5 -apple-system, "Pretendard", sans-serif; text-align: center;
  }
  .pick p { margin: 0 0 6px; opacity: .6; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: 1px solid rgba(255,255,255,.6); color: #fff; background: none;
    padding: 12px 20px; font: inherit; letter-spacing: .5px; cursor: pointer;
  }
  .btn:hover { background: #fff; color: #000; }
  .again {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    padding: 8px 14px; font-size: 12px; background: rgba(0,0,0,.5);
  }
  .cam { display: none; }
  @media (pointer: coarse) { .cam { display: inline-block; } }
  [hidden] { display: none !important; }
  input { display: none; }
</style>
</head>
<body>
<canvas aria-label="올린 사진을 짧은 선 수천 개로 다시 그립니다. 선은 커서를 향해 눕고, 누르고 있으면 굵기가 천천히 일렁입니다."></canvas>

<div class="pick" id="pick">
  <p>사진 한 장으로 시작합니다.<br>사진은 이 기기 안에서만 쓰이고 어디에도 올라가지 않습니다.</p>
  <div class="btns">
    <label class="btn">이미지 선택<input type="file" accept="image/*" id="f1"></label>
    <label class="btn cam">사진 찍기<input type="file" accept="image/*" capture="environment" id="f2"></label>
  </div>
</div>
<label class="btn again" id="again" hidden>다른 사진<input type="file" accept="image/*" id="f3"></label>

<script>
(() => {
  const cv = document.querySelector('canvas'), ctx = cv.getContext('2d');
  const pick = document.getElementById('pick'), again = document.getElementById('again');
  let W = 0, H = 0, DPR = 1, img = null, dots = [], sz = 8;
  let mx = -1, my = -1, press = 0, pressing = false, t = 0, dirty = true, last = 0, raf = 0;

  function load(file) {
    if (!file || !/^image\//.test(file.type)) return;
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      img = im; URL.revokeObjectURL(url);
      pick.hidden = true; again.hidden = false;
      mx = W / 2; my = H / 2; sample(); kick();
    };
    im.src = url;
  }
  ['f1', 'f2', 'f3'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('change', () => { load(el.files[0]); el.value = ''; });
  });

  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (img) sample();
    kick();
  }

  // 화면을 덮도록 맞춘 사진에서 격자마다 색을 한 번만 뽑아 둡니다
  function sample() {
    sz = Math.max(5, 8 * W / 1200);
    const gx = sz * 1.3, gy = sz * 0.7;   // 원작보다 촘촘하게
    const cols = Math.ceil(W / gx) + 1, rows = Math.ceil(H / gy) + 1;
    const off = document.createElement('canvas');
    off.width = cols; off.height = rows;
    const o = off.getContext('2d');
    const s = Math.max(cols / img.width, rows / img.height);
    const dw = img.width * s, dh = img.height * s;
    o.drawImage(img, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
    const px = o.getImageData(0, 0, cols, rows).data;
    dots = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const i = (r * cols + c) * 4;
        dots.push({ x: c * gx, y: r * gy, c: 'rgb(' + px[i] + ',' + px[i + 1] + ',' + px[i + 2] + ')',
          ph: Math.random() * 6.2832, f: 0.6 + Math.random() * 0.9, lo: 3 + Math.random() * 2 });
      }
    dirty = true;
  }

  function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    // 누르면 선마다 굵기가 따로 3~7 사이를 오가 화면이 꿈틀거립니다
    ctx.lineCap = 'round';   // 선 끝을 둥글게
    const L = sz / 2 * Math.SQRT2, q = Math.PI / 4;
    for (let n = 0; n < dots.length; n++) {
      const d = dots[n];
      const a = Math.atan2(my - d.y, mx - d.x) + q;
      const wave = d.lo + (Math.sin(t * d.f * 7 + d.ph) * 0.5 + 0.5) * 2;
      ctx.lineWidth = 1 + (wave - 1) * press;
      ctx.strokeStyle = d.c;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + Math.cos(a) * L, d.y + Math.sin(a) * L); ctx.stroke();
    }
  }

  function frame(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    const goal = pressing ? 1 : 0;
    const moving = Math.abs(goal - press) > 0.002 || press > 0.002;
    press += (goal - press) * Math.min(1, dt * 4);   // 약 0.5초에 걸쳐 부드럽게
    if (press > 0.002) t += dt;
    if (img && (dirty || moving)) { draw(); dirty = false; }
    if (moving) kick(); else last = 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  cv.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; dirty = true; kick(); });
  cv.addEventListener('pointerdown', e => { mx = e.clientX; my = e.clientY; pressing = true; dirty = true; kick(); });
  addEventListener('pointerup', () => { pressing = false; kick(); });
  addEventListener('pointercancel', () => { pressing = false; kick(); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
