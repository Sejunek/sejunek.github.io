<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laputa / Skyward — Lab</title><link rel="icon" href="data:,"><style>
/* 모바일에서 길게 누를 때 텍스트가 선택되거나 확대/복사 메뉴가 뜨지 않도록 합니다.
   이 스케치는 '꾹 누르기'가 조작이라 브라우저 기본 동작과 부딪힙니다. */
html,body,canvas{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Archivo,"Helvetica Neue",Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #2d45ff;outline-offset:-3px}.hint{position:fixed;bottom:18px;left:22px;right:22px;margin:0;color:#8a8a8a;font-size:11px;letter-spacing:1.2px;line-height:1.8;pointer-events:none;text-align:center}.status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#ffffffed;color:#8a8a8a;font-size:13px;line-height:1.8;padding:24px}.status[hidden]{display:none}progress{width:180px;height:3px;accent-color:#2d45ff;margin:14px auto}noscript{position:fixed;top:45%;width:100%;text-align:center}
.hint{color:#536c80;text-shadow:0 1px 8px white}.actions{position:fixed;right:18px;top:18px;display:flex;gap:8px}.actions button{font:11px Archivo,Arial,sans-serif;letter-spacing:1.2px;padding:10px 12px;color:#43596b;background:#ffffffb8;border:1px solid #ffffff88;cursor:pointer}.actions button[hidden]{display:none}.actions button:focus-visible{outline:2px solid #2d45ff}</style></head><body>
<div class="status" role="status"><span id="message">라퓨타를 불러오는 중입니다.</span><progress aria-label="모델 로딩"></progress></div>
<p class="hint">드래그로 회전 · 휠 드래그로 중심 이동 · 스크롤 / 핀치로 확대 · 더블클릭으로 탐색</p>
<div class="actions"><button id="skip" hidden>SKIP INTRO</button><button id="home" disabled>원 시점으로</button><button id="pause" aria-pressed="false">PAUSE SKY</button></div><noscript>이 작품을 보려면 JavaScript를 켜주세요.</noscript>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
(()=>{'use strict';
const status=document.querySelector('.status'),message=document.querySelector('#message'),progress=document.querySelector('progress');
function fail(text){status.hidden=false;message.textContent=text;progress.hidden=true;}
if(!window.THREE||!THREE.OrbitControls||!THREE.GLTFLoader||!THREE.DRACOLoader){fail('3D 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인하고 다시 열어주세요.');return;}
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});}catch(e){fail('WebGL을 사용할 수 없습니다. 하드웨어 가속을 지원하는 브라우저에서 열어주세요.');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;document.body.prepend(renderer.domElement);
const canvas=renderer.domElement;canvas.tabIndex=0;canvas.setAttribute('aria-label','라퓨타 3D 탐색. 드래그와 방향키로 회전, 휠 또는 더하기 빼기로 확대, H로 처음 시점.');
const scene=new THREE.Scene();scene.background=new THREE.Color('#ffffff');const camera=new THREE.PerspectiveCamera(40,1,.05,1000);const controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=true;controls.panSpeed=.35;controls.screenSpacePanning=true;controls.mouseButtons.MIDDLE=THREE.MOUSE.PAN;controls.mouseButtons.RIGHT=THREE.MOUSE.ROTATE;controls.rotateSpeed=.24;controls.zoomSpeed=.45;controls.minPolarAngle=.12;controls.maxPolarAngle=Math.PI*.85;
scene.add(new THREE.HemisphereLight(0xe8f2ff,0x73715f,.85));const key=new THREE.DirectionalLight(0xfff1d9,1.15);key.position.set(-30,55,35);scene.add(key);const fill=new THREE.DirectionalLight(0xdbe8ff,.35);fill.position.set(35,10,-30);scene.add(fill);
let model=null,radius=20,frame=0,loaded=false,contextLost=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),skip=document.querySelector('#skip'),pause=document.querySelector('#pause');let intro=false,introTime=0,elapsed=0,lastTime=0,paused=false;const clouds=[];const homeTarget=new THREE.Vector3(),homePosition=new THREE.Vector3();
const stats=window.laputaStats={ready:false,frames:0,calls:0,triangles:0};
function draw(time){frame=0;if(document.hidden||contextLost)return;const dt=lastTime?Math.min((time-lastTime)/1000,.05):0;lastTime=time;
if(loaded&&!reduced.matches&&!paused){elapsed+=dt;for(const cloud of clouds){cloud.position.x=cloud.userData.x+Math.sin(elapsed*.018+cloud.userData.phase)*radius*.8;cloud.position.z=cloud.userData.z+Math.cos(elapsed*.012+cloud.userData.phase)*radius*.3;}if(intro){introTime+=dt;const t=Math.min(1,introTime/8),e=t*t*t*(t*(t*6-15)+10),angle=Math.PI/4+(1-e)*Math.PI*1.45,distance=homePosition.distanceTo(homeTarget)*(1+2.5*(1-e)),elevation=Math.atan(.48/Math.sqrt(2))+.22*(1-e);camera.position.copy(homeTarget).add(new THREE.Vector3(Math.sin(angle)*Math.cos(elevation),Math.sin(elevation),Math.cos(angle)*Math.cos(elevation)).multiplyScalar(distance));camera.lookAt(homeTarget);if(t===1)finishIntro();}}
if(loaded&&!intro)controls.update();renderer.render(scene,camera);stats.target=controls.target.toArray();stats.frames++;stats.calls=renderer.info.render.calls;stats.triangles=renderer.info.render.triangles;stats.intro=intro;stats.elapsed=elapsed;stats.camera=camera.position.toArray();if(loaded&&!reduced.matches&&!paused)invalidate();else lastTime=0;}
function finishIntro(){intro=false;skip.hidden=true;controls.enabled=true;home();}
function syncMotion(){lastTime=0;controls.enableDamping=!reduced.matches;if(reduced.matches){if(intro)finishIntro();pause.disabled=true;pause.textContent='STILL SKY';}else{pause.disabled=false;pause.textContent=paused?'RESUME SKY':'PAUSE SKY';}invalidate();}
document.querySelector('#home').addEventListener('click',()=>{if(loaded)finishIntro();});skip.addEventListener('click',finishIntro);pause.addEventListener('click',()=>{paused=!paused;pause.setAttribute('aria-pressed',String(paused));syncMotion();});reduced.addEventListener('change',syncMotion);
function createAtmosphere(){
const sky=new THREE.Mesh(new THREE.SphereGeometry(radius*23,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{},vertexShader:'varying vec3 direction;void main(){direction=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying vec3 direction;void main(){vec3 d=normalize(direction);float h=smoothstep(-.65,.85,d.y);vec3 c=mix(vec3(.88,.94,.98),vec3(.23,.52,.77),h);float sun=pow(max(dot(d,normalize(vec3(-.6,.4,-.7))),0.0),90.0);c+=vec3(.24,.18,.10)*sun;gl_FragColor=vec4(c,1.0);}'}));sky.position.copy(homeTarget);sky.renderOrder=-10;scene.add(sky);scene.background=null;
const textureCanvas=document.createElement('canvas');textureCanvas.width=512;textureCanvas.height=256;const c=textureCanvas.getContext('2d');let seed=23;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
for(let i=0;i<50;i++){const x=90+random()*330,y=112+(random()-.5)*75,r=24+random()*47,g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.55,'rgba(250,253,255,.36)');g.addColorStop(1,'rgba(237,245,255,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}const tex=new THREE.CanvasTexture(textureCanvas);tex.encoding=THREE.sRGBEncoding;
for(let i=0;i<52;i++){const angle=random()*Math.PI*2,ring=radius*(2.6+random()*6),cloud=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,toneMapped:false,transparent:true,opacity:.55+random()*.35,depthWrite:false,fog:false}));cloud.position.set(homeTarget.x+Math.sin(angle)*ring,homeTarget.y-radius*(.65+random()*1.5),homeTarget.z+Math.cos(angle)*ring);const scale=radius*(2.2+random()*3);cloud.scale.set(scale,scale*.42,1);cloud.userData={x:cloud.position.x,z:cloud.position.z,phase:random()*6};clouds.push(cloud);scene.add(cloud);}
// Distant gliding birds, kept outside the castle silhouette.
const birdPositions=[];for(let i=0;i<14;i++){const x=(random()-.5)*radius*8,y=homeTarget.y+radius*(.5+random()),z=-radius*(2+random()*2),a=radius*.04;birdPositions.push(x-a,y,z,x,y-a*.3,z,x,y-a*.3,z,x+a,y,z);}const birds=new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(birdPositions,3)),new THREE.LineBasicMaterial({color:0x647e8e,transparent:true,opacity:.45}));scene.add(birds);
}

function invalidate(){if(!frame&&!document.hidden&&!contextLost)frame=requestAnimationFrame(draw);}
controls.addEventListener('change',invalidate);
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/Math.max(1,innerHeight);camera.updateProjectionMatrix();if(loaded){setHome();}invalidate();}
function setHome(){const fov=THREE.MathUtils.degToRad(camera.fov),lim=Math.min(fov,2*Math.atan(Math.tan(fov/2)*camera.aspect)),distance=radius/Math.sin(lim/2)*.76;homePosition.copy(homeTarget).add(new THREE.Vector3(1,.48,1).normalize().multiplyScalar(distance));controls.maxDistance=distance*2;}
function home(){const damping=controls.enableDamping;controls.enableDamping=false;controls.update();controls.target.copy(homeTarget);camera.position.copy(homePosition);controls.update();controls.enableDamping=damping;invalidate();}
const decoder=new THREE.DRACOLoader();decoder.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/gltf/');decoder.setWorkerLimit(2);const loader=new THREE.GLTFLoader();loader.setDRACOLoader(decoder);
loader.load('../../assets/models/lab/laputa-web.glb?v=laputa2',g=>{model=g.scene;const box=new THREE.Box3().setFromObject(model),sphere=box.getBoundingSphere(new THREE.Sphere());radius=sphere.radius;homeTarget.copy(sphere.center);scene.add(model);camera.near=radius/1500;camera.far=radius*80;camera.updateProjectionMatrix();controls.minDistance=radius*.12;loaded=true;document.querySelector('#home').disabled=false;setHome();home();createAtmosphere();intro=!reduced.matches;introTime=0;controls.enabled=!intro;skip.hidden=!intro;status.hidden=true;stats.ready=true;syncMotion();stats.meshes=0;model.traverse(o=>{if(o.isMesh)stats.meshes++;});decoder.dispose();},e=>{if(e.lengthComputable){progress.max=e.total;progress.value=e.loaded;message.textContent='라퓨타를 불러오는 중 · '+Math.round(e.loaded/e.total*100)+'%';}},()=>{decoder.dispose();fail('모델을 불러오지 못했습니다. 네트워크 연결을 확인한 후 다시 열어주세요.');});
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();canvas.addEventListener('dblclick',e=>{if(!model||intro)return;const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObject(model,true)[0];if(!hit)return;const direction=camera.position.clone().sub(hit.point).normalize();controls.target.copy(hit.point);camera.position.copy(hit.point).addScaledVector(direction,radius*.65);controls.update();invalidate();});
canvas.addEventListener('keydown',e=>{if(!loaded)return;if(intro){if(e.key==='Escape'||e.key.toLowerCase()==='h'){e.preventDefault();finishIntro();}return;}const offset=camera.position.clone().sub(controls.target),s=new THREE.Spherical().setFromVector3(offset);if(e.key.toLowerCase()==='h'){e.preventDefault();home();return;}if(e.key==='ArrowLeft')s.theta-=.08;else if(e.key==='ArrowRight')s.theta+=.08;else if(e.key==='ArrowUp')s.phi-=.06;else if(e.key==='ArrowDown')s.phi+=.06;else if(e.key==='+'||e.key==='=')s.radius*=.9;else if(e.key==='-')s.radius*=1.1;else return;e.preventDefault();s.phi=THREE.MathUtils.clamp(s.phi,controls.minPolarAngle,controls.maxPolarAngle);s.radius=THREE.MathUtils.clamp(s.radius,controls.minDistance,controls.maxDistance);camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));controls.update();invalidate();});
canvas.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault();});canvas.addEventListener('pointerdown',()=>canvas.focus());canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();contextLost=true;cancelAnimationFrame(frame);frame=0;fail('그래픽 연결이 중단되었습니다. 복구를 기다리거나 뷰어에서 RESTART를 눌러주세요.');});canvas.addEventListener('webglcontextrestored',()=>{contextLost=false;if(loaded)status.hidden=true;invalidate();});
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);frame=0;lastTime=0;if(!document.hidden)invalidate();});addEventListener('resize',resize);resize();
// Reduced motion skips the arrival and freezes the sky; manual exploration remains available.
})();
</script><script>
/* 길게 누르기 = 조작. 선택·확대 메뉴를 막습니다. */
addEventListener('contextmenu',e=>{const t=e.target;if(t&&t.closest&&t.closest('canvas'))e.preventDefault();});
addEventListener('selectstart',e=>{const t=e.target;if(t&&t.closest&&t.closest('canvas'))e.preventDefault();});
</script>
</body></html>
