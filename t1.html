<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 테스트</title>
<style>
  body { margin:0; font:16px/1.6 -apple-system, sans-serif; }
  #top { background:#e01b1b; color:#fff; padding:20px; font-weight:700; }
  .row { padding:28px 20px; border-bottom:1px solid #ddd; }
  .row:nth-child(even) { background:#f4f4f2; }
  #hud { position:fixed; left:0; right:0; bottom:0; background:#111; color:#fff;
         padding:8px 12px; font:12px/1.5 ui-monospace, monospace; }
  #hud button { font:inherit; margin-left:8px; padding:2px 8px; }
</style>
</head>
<body>
<!-- 사이트 CSS·JS 없는 맨 페이지. 빨간 띠가 맨 위입니다. -->
<div id="top">▲ 맨 위 (빨간 띠가 보이면 끝까지 올라온 것)</div>
<div id="hud">
  scrollY <b id="y">0</b> · 최저 <b id="mn">0</b> · 화면높이 <b id="h">0</b> · vv위 <b id="vv">0</b>
  <button type="button" id="go">맨 위로</button>
</div>
<script>
  var html = '';
  for (var i = 1; i <= 60; i++) html += '<div class="row">' + i + ' — 아래로 내렸다가 다시 위로 올려보세요.</div>';
  document.getElementById('top').insertAdjacentHTML('afterend', html);
  var y = document.getElementById('y'), mn = document.getElementById('mn'),
      h = document.getElementById('h'), vv = document.getElementById('vv'), lo = 1e9;
  function upd() {
    var v = Math.round(window.scrollY);
    if (v < lo) { lo = v; mn.textContent = v; }
    y.textContent = v; h.textContent = window.innerHeight;
    vv.textContent = window.visualViewport ? Math.round(window.visualViewport.offsetTop) : '-';
  }
  addEventListener('scroll', upd, { passive: true });
  addEventListener('resize', upd);
  if (window.visualViewport) visualViewport.addEventListener('resize', upd);
  document.getElementById('go').onclick = function () { window.scrollTo(0, 0); setTimeout(upd, 300); };
  upd();
</script>
</body>
</html>
